grid-template-columns:1fr}.arrow{transform:rotate(90deg)}h1{font-size:30px}.plain{font-size:18px}}</style></head><body><div class="top">Bodhi<b>Protocol</b></div><main class="wrap"><div class="tabs"><a href="?term=Kafka" id="tk">Kafka</a><a href="?term=API" id="ta">API</a></div><article class="card" id="card"></article></main><script>const q=new URLSearchParams(location.search).get('term')||'Kafka';const api={title:'API',full:'Application Programming Interface',plain:'An API is a way for one system to ask another system for data or an action — using an agreed set of rules.',visual:'<div class="flow"><div class="box">📱 Your App</div><div class="arrow">→</div><div class="box core">API<br><small>the agreed doorway</small></div><div class="arrow">→</div><div class="box">🖥 Service / Data</div></div>',example:'Your shopping app asks a payment service to charge ₹500. The API carries the request and returns success or failure.',contrast:'<strong>Don’t confuse it with Kafka.</strong> An API usually handles a direct request between systems. Kafka publishes events that multiple systems can consume independently.',rel:['REST','HTTP','JSON','Endpoint']};const kafka={title:'Kafka',full:'Event Streaming Platform',plain:'Kafka lets one system publish an event once, while many other systems can receive and react to it independently.',visual:'<div class="flow"><div class="col"><div class="box">🛒 Order placed</div><div class="box">📱 App event</div><div class="box">⚙ Service event</div></div><div class="arrow">→</div><div class="box core">KAFKA<br><small>events wait in a stream</small></div><div class="arrow">→</div><div class="col"><div class="box">💳 Payment</div><div class="box">📊 Analytics</div><div class="box">🔔 Notification</div></div></div>',example:'An order is placed once. Payment, analytics and notifications can each react to that same event without the order system calling all three directly.',contrast:'<strong>Don’t confuse it with an API.</strong> With an API, one system usually asks another for something. With Kafka, a system publishes an event and interested consumers react to it.',rel:['Message Queue','Producer','Consumer','Topic','Event']};let x=q.toLowerCase()==='api'?api:kafka;document.getElementById(q.toLowerCase()==='api'?'ta':'tk').classList.add('active');card.innerHTML='<div class="kicker">What is it?</div><h1>'+x.title+'</h1><div class="full">'+x.full+'</div><div class="plain">'+x.plain+'</div><div class="visual"><div class="label">Show me</div>'+x.visual+'</div><div class="example"><div class="label">Give me an example</div>'+x.example+'</div><div class="contrast"><div class="label">Don’t confuse it with…</div>'+x.contrast+'</div><div class="links"><div class="label">Related concepts</div>'+x.rel.map(r=>'<span class="chip">'+r+'</span>').join('')+'</div>';</script></body></html>
