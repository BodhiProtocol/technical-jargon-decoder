x;font-size:19px}.core small{display:block;margin-top:5px;font-size:12px;line-height:1.35;color:#4b665d}.arrow{text-align:center;font-size:25px;color:#11835f}.pipeline{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.step{min-width:96px;border:1px solid #dde2e7;border-radius:12px;background:#fff;padding:15px 10px;text-align:center;font-weight:800}.step.core{background:#eef9f4}.compare{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.compare .box{padding:20px 14px}.stack{display:grid;gap:8px;min-width:min(520px,100%);margin:auto}.layer{border:1px solid #dde2e7;background:#fff;border-radius:11px;padding:12px;text-align:center;font-weight:750}.layer.core{background:#eef9f4}.lower{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}.example,.contrast{border-top:1px solid #e5e7eb;padding-top:15px;line-height:1.5;font-size:13px}.contrast strong{color:#b54747}.label{margin-bottom:7px}.links{margin-top:16px;border-top:1px solid #e5e7eb;padding-top:14px}.chip{display:inline-block;border:1px solid #cde8dd;background:#f6fcf9;color:#11835f;border-radius:999px;padding:6px 11px;margin:4px 5px 0 0;font-size:11px;cursor:pointer}.empty{color:#98a2b3;font-size:12px}@media(max-width:700px){.topin,.wrap{padding:0 14px}.card{padding:22px 20px}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.compare{grid-template-columns:1fr}.compare .arrow{transform:rotate(90deg)}.lower{grid-template-columns:1fr}.bar{flex-wrap:wrap}.search{width:100%;flex-basis:100%}h1{font-size:30px}.plain{font-size:17px}}</style></head><body><header class="top"><div class="topin"><div class="brand">Bodhi<b>Protocol</b></div><a class="back" href="./">← Jargon Decoder home</a></div></header><main class="wrap"><div class="bar"><input id="search" class="search" list="allterms" placeholder="Search any concept…"><datalist id="allterms"></datalist><span class="count" id="count">Loading…</span><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="randomTerm()">Random</button><button class="ghost" onclick="next()">→</button></div><article class="card" id="card">Loading library…</article></main><script>const ARCHIVE='https://raw.githubusercontent.com/BodhiProtocol/technical-jargon-decoder/8853a32fe2c8bba4ad92dbfd1889e592ec8b885f/index.html';const EXTRA=[['Kafka','Event Streaming Platform',2,'Kafka lets one system publish an event once, while many other systems can receive and react to it independently.','Like a durable shared news feed.','An order is placed once. Payment, analytics and notifications can each react to that same event without the order system calling all three directly.',['Message Queue','Producer','Consumer','Topic','Event']],['OAuth','Open Authorization',0,'OAuth lets an app get limited access to another service without receiving your password.','Like giving a valet key instead of your master key.','A budgeting app can read approved bank data without learning your bank password.',['Authentication vs. Authorization','API']],['Webhook','Webhook',0,'A webhook lets one system automatically tell another system when something has happened.','Like getting a delivery notification instead of repeatedly checking the door.','A payment provider sends your system a webhook when a payment succeeds.',['API','REST','JSON']],['REST','Representational State Transfer',0,'REST is a common way to design web APIs around resources and standard HTTP actions.','Think predictable URLs plus standard actions.','GET /orders reads orders; POST /orders creates one.',['API','JSON']],['JSON','JavaScript Object Notation',2,'JSON is a simple text format for sending structured data as names and values.','Like a labelled form software can read.','An API may return customer name, id and status as JSON.',['API','REST','SQL']],['Message Queue','Message Queue',4,'A message queue lets one system leave work for another system to process later.','Like a ticket tray where work waits safely.','Checkout places an email task on a queue instead of waiting for the email to send.',['Kafka','Microservices']],['DNS','Domain Name System',1,'DNS turns a domain name into the network address computers need to find the right server.','Like contacts turning a name into a phone number.','DNS tells your browser which server hosts bodhiprotocol.com.',['CDN','Load Balancer']],['Docker','Docker / Container',1,'Docker packages an application with what it needs so it runs consistently across environments.','Like a standard shipping container for software.','The same container image can run in dev, test and production.',['Kubernetes','CI/CD']],['Git','Git / Version Control',5,'Git records changes to files so teams can compare, branch, merge and restore versions safely.','Like a detailed project history you can branch.','A developer creates a branch, commits changes and merges them after review.',['CI/CD','Branch']],['SQL','Structured Query Language',2,'SQL is a language for asking relational databases precise questions and changing stored data.','Like asking a very specific question of tables.','A BA can use SQL to compare source and target records.',['Database Index','Database']],['Database Index','Database Index',2,'A database index helps the database find matching rows quickly without scanning everything.','Like a book index taking you to the right page.','An index on customer_id speeds up repeated customer lookups.',['SQL','Cache']],['Cache','Cache',1,'A cache keeps frequently needed data somewhere faster so it does not have to be fetched or calculated again each time.','Like keeping commonly used documents on your desk.','A service caches product details instead of querying the database for every request.',['CDN','Database Index']]];const ALIAS={'container (docker)':'Docker','git / version control':'Git','index (database)':'Database Index'};const DIST={api:['Kafka','An API is usually a direct ask-and-answer interaction. Kafka is event publication that many consumers can react to independently.'],kafka:['API','Kafka publishes events for interested consumers. An API usually handles a direct request between systems.'],docker:['Kubernetes','Docker packages and runs containers. Kubernetes coordinates many containers across machines.'],kubernetes:['Docker','Docker creates/runs containers. Kubernetes schedules, scales and manages groups of containers.'],oauth:['Authentication vs. Authorization','OAuth is about delegated access. Authentication proves identity; authorization decides what an identity may do.'],authenticationvsauthorization:['OAuth','Authentication answers “who are you?” and authorization answers “what may you do?” OAuth is one way to delegate access.'],messagequeue:['Kafka','A queue usually hands work to a consumer for processing. Kafka keeps an event log that multiple consumers can read independently.'],sql:['Database','SQL is a language used to work with relational databases. The database is the system that stores and manages the data.'],databaseindex:['Cache','An index helps a database find stored rows faster. A cache keeps a separate fast copy of frequently needed results or data.'],cache:['Database Index','A cache stores reusable results/data closer or faster. A database index speeds lookup inside the database itself.'],cdn:['Cache','A CDN is a distributed network that serves content close to users. Caching is the broader technique of keeping reusable copies.'],loadbalancer:['CDN','A load balancer spreads requests across servers. A CDN serves cached content from geographically distributed locations.'],microservices:['Monolith','Microservices split an application into independently deployable services. A monolith packages most functionality together.'],monolith:['Microservices','A monolith keeps most application functionality together. Microservices split it into independently deployable services.'],unittesting:['Integration Testing','Unit tests check a small isolated piece. Integration tests check whether multiple pieces work together.'],integrationtesting:['Unit Testing','Integration tests check components together. Unit tests check one small piece in isolation.'],uat:['Regression Testing','UAT checks whether the product meets business needs. Regression testing checks whether changes broke existing behaviour.'],regressiontesting:['UAT','Regression testing protects existing behaviour after change. UAT checks whether the solution satisfies business needs.'],primarykey:['Foreign Key','A primary key uniquely identifies a row in its own table. A foreign key points to a row in another table.'],foreignkey:['Primary Key','A foreign key links to another table. A primary key uniquely identifies rows in its own table.'],frameworkvslibrary:['Library','A library is code your application calls. A framework usually controls the application flow and calls your code at defined points.'],cicd:['Deployment','CI/CD is the automated path from code changes through build/test and often deployment. Deployment is the act of releasing a build to an environment.'],git:['GitHub','Git is the version-control system. GitHub is a service that hosts Git repositories and collaboration workflows.']};let data=[],current=0;const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function parse(t){let m=t.match(/const ITEMS = \[([\s\S]*?)\n\];/);if(!m)throw Error('Library data not found');return Function('return ['+m[1]+']')()}function canon(base){let out=[],seen=new Set;[...base.map(x=>ALIAS[String(x.t).toLowerCase()]?{...x,t:ALIAS[String(x.t).toLowerCase()]}:x),...EXTRA.map(x=>({t:x[0],full:x[1],c:x[2],p:x[3],a:x[4],w:x[5],rel:x[6]}))].forEach(x=>{let k=norm(x.t);if(!seen.has(k)){seen.add(k);out.push(x)}});return out}function three(a,b,c,sub=''){return `<div class="flow"><div class="box">${esc(a)}</div><div class="arrow">→</div><div class="box core">${esc(b)}${sub?`<small>${esc(sub)}</small>`:''}</div><div class="arrow">→</div><div class="box">${esc(c)}</div></div>`}function visual(x){let n=norm(x.t);if(n==='api')return `<div class="flow"><div class="box">📱 Your App</div><div class="arrow">→</div><div class="box core">API<small>request goes out<br>response comes back</small></div><div class="arrow">↔</div><div class="box">🖥 Service / Data</div></div>`;if(n==='kafka')return `<div class="flow"><div class="col"><div class="box">🛒 OrderPlaced</div><div class="box">📱 App event</div><div class="box">⚙ Service event</div></div><div class="arrow">→</div><div class="box core">KAFKA<small>events stored in ordered logs</small></div><div class="arrow">→</div><div class="col"><div class="box">💳 Payment</div><div class="box">📊 Analytics</div><div class="box">🔔 Notification</div></div></div>`;if(n==='cicd')return `<div class="pipeline"><div class="step">⌨ Code</div>→<div class="step">⚙ Build</div>→<div class="step">✓ Test</div>→<div class="step core">🚀 Deploy</div>→<div class="step">▣ Production</div></div>`;if(n==='authenticationvsauthorization')return `<div class="compare"><div class="box"><b>Authentication</b><br><small>Who are you?</small></div><div class="arrow">→</div><div class="box"><b>Authorization</b><br><small>What may you do?</small></div></div>`;if(n==='docker')return three('Your app','Docker container','Runs consistently','app + dependencies');if(n==='kubernetes')return three('Many containers','Kubernetes','Healthy running services','schedule · scale · recover');if(n==='dns')return three('bodhiprotocol.com','DNS','Server IP','name → address');if(n==='loadbalancer')return `<div class="flow"><div class="box">Users</div><div class="arrow">→</div><div class="box core">Load Balancer<small>chooses a healthy server</small></div><div class="arrow">→</div><div class="col"><div class="box">Server A</div><div class="box">Server B</div><div class="box">Server C</div></div></div>`;if(n==='sql')return three('Question','SQL','Matching rows','query tables');if(n==='databaseindex')return three('Lookup customer 42','Index','Matching row','skip full scan');if(n==='cache')return three('Request','Cache','Fast response','reuse recent data');if(n==='etl')return three('Source data','Transform','Target data','extract · clean · load');if(n==='datalineage')return three('Source','Transformations','Target','where data came from');if(n==='microservices')return `<div class="flow"><div class="box">Client</div><div class="arrow">→</div><div class="box core">API / Gateway</div><div class="arrow">→</div><div class="col"><div class="box">Orders</div><div class="box">Payments</div><div class="box">Notifications</div></div></div>`;if(n==='monolith')return `<div class="stack"><div class="layer">UI</div><div class="layer core">One application</div><div class="layer">Business logic + data access</div></div>`;if(n==='threetierarchitecture')return `<div class="stack"><div class="layer">Presentation</div><div class="layer core">Business Logic</div><div class="layer">Data</div></div>`;if(n==='primarykey'||n==='foreignkey')return `<div class="compare"><div class="box"><b>Customer</b><br>Customer_ID 🔑</div><div class="arrow">→</div><div class="box"><b>Order</b><br>Customer_ID ↗</div></div>`;if(n==='boundaryvalueanalysis')return three('17 · 18 · 19','Boundary','59 · 60 · 61','test below · at · above');if(n==='git')return `<div class="pipeline"><div class="step">Working files</div>→<div class="step core">Commit</div>→<div class="step">History</div>→<div class="step">Branch / Merge</div></div>`;if(n==='sprint')return three('Prioritised backlog','Sprint','Working increment','time-boxed delivery');if(n==='userstory')return three('User','Need','Value','who · what · why');if(n==='acceptancecriteria')return three('User story','Acceptance criteria','Clear “done”','rules to satisfy');if(n==='uat')return three('Business need','UAT','Accept / Reject','business validates');if(n==='regressiontesting')return three('Existing feature','Change','Re-test','did we break anything?');const c=x.c;return c===2?three('Question / input',x.t,'Data / answer'):c===3?three('Scenario',x.t,'Expected result'):c===1?three('Request',x.t,'Service / response'):c===4?three('Input',x.t,'Components'):c===5?three('Work to do',x.t,'Delivered outcome'):three('Need',x.t,'Outcome')}function example(x){return x.w||x.a||`You would use ${x.t} when this concept is needed in a real system or delivery flow.`}function contrast(x){let d=DIST[norm(x.t)];if(d)return `<strong>Don’t confuse it with ${esc(d[0])}.</strong> ${esc(d[1])}`;let r=(x.rel||[])[0];if(r)return `<strong>${esc(x.t)} and ${esc(r)} are related, but not interchangeable.</strong> Use ${esc(x.t)} for the specific job described above; open ${esc(r)} next to see how its role differs.`;return `<span class="empty">No common mix-up identified for this term yet.</span>`}function render(){let x=data[current];card.innerHTML=`<div class="kicker">What is it?</div><div class="titleline"><h1>${esc(x.t)}</h1><div class="full">${esc(x.full||'')}</div></div><div class="plain">${esc(x.p||x.m||'')}</div><div class="visual"><div class="label">Show me</div>${visual(x)}</div><div class="lower"><div class="example"><div class="label">Give me an example</div>${esc(example(x))}</div><div class="contrast"><div class="label">Don’t confuse it with…</div>${contrast(x)}</div></div><div class="links"><div class="label">Related concepts</div>${(x.rel||[]).map(r=>`<button class="chip" onclick="go('${encodeURIComponent(r)}')">${esc(r)}</button>`).join('')||'<span class="empty">No related concepts listed yet.</span>'}</div>`;count.textContent=`${current+1} of ${data.length}`;search.value=x.t;history.replaceState(null,'','?term='+encodeURIComponent(x.t))}function go(v){let q=decodeURIComponent(v),i=data.findIndex(x=>norm(x.t)===norm(q));if(i>=0){current=i;render()}}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){current=Math.floor(Math.random()*data.length);render()}search.addEventListener('change',()=>go(search.value));search.addEventListener('keydown',e=>{if(e.key==='Enter')go(search.value)});fetch(ARCHIVE).then(r=>{if(!r.ok)throw Error('Archive unavailable');return r.text()}).then(t=>{data=canon(parse(t));allterms.innerHTML=data.map(x=>`<option value="${esc(x.t)}"></option>`).join('');let q=new URLSearchParams(location.search).get('term');if(q){let i=data.findIndex(x=>norm(x.t)===norm(q));if(i>=0)current=i}render()}).catch(()=>card.innerHTML='Library unavailable. Please refresh.');</script></body></html>
