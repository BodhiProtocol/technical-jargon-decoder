<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BodhiProtocol · Clarity Decoder</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#111827;font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{height:60px;background:#fff;border-bottom:1px solid #e5e7eb}.topin{max-width:1100px;height:100%;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:#111827}.brand b{color:#7257e8}.back{font-size:12px;color:#667085;text-decoration:none}.wrap{max-width:1100px;margin:22px auto;padding:0 20px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs a{text-decoration:none;color:#667085;background:#fff;border:1px solid #e5e7eb;padding:7px 11px;border-radius:10px;font-size:13px}.tabs a.active{background:#eef9f4;color:#11835f;border-color:#bfe4d6}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:26px 30px;box-shadow:0 14px 40px #2028400a}.kicker,.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#687386;font-weight:850}.titleline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}h1{font-size:34px;letter-spacing:-.035em;margin:0}.full{color:#148763;font-weight:800;font-size:13px}.plain{font-size:19px;line-height:1.48;max-width:900px;margin:20px 0}.visual{margin:20px 0 0;padding:22px 26px 24px;border-radius:18px;background:#fbfcfd;border:1px solid #e8ebef}.visual .label{margin-bottom:14px}.flow{display:grid;grid-template-columns:1fr 58px 1.2fr 58px 1fr;gap:10px;align-items:center}.col{display:grid;gap:8px}.box{background:#fff;border:1px solid #dde2e7;border-radius:12px;padding:11px;text-align:center;font-weight:750}.core{background:#eef9f4;border-color:#bfe4d6;color:#11835f;padding:24px 12px;font-size:19px}.core small{display:block;margin-top:5px;font-size:12px;line-height:1.35}.arrow{text-align:center;font-size:25px;color:#11835f}.lower{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}.example,.contrast{border-top:1px solid #e5e7eb;padding-top:15px;line-height:1.5;font-size:13px}.contrast strong{color:#b54747}.label{margin-bottom:7px}.links{margin-top:16px;border-top:1px solid #e5e7eb;padding-top:14px}.chip{display:inline-block;border:1px solid #cde8dd;background:#f6fcf9;color:#11835f;border-radius:999px;padding:6px 11px;margin:4px 5px 0 0;font-size:11px}@media(max-width:700px){.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.lower{grid-template-columns:1fr}.topin{padding:0 14px}.wrap{padding:0 14px}.card{padding:22px 20px}h1{font-size:30px}.plain{font-size:17px}}</style></head><body><header class="top"><div class="topin"><div class="brand">Bodhi<b>Protocol</b></div><a class="back" href="./">← Jargon Decoder home</a></div></header><main class="wrap"><div class="tabs"><a href="?term=Kafka" id="tk">Kafka</a><a href="?term=API" id="ta">API</a></div><article class="card" id="card"></article></main><script>const q=new URLSearchParams(location.search).get('term')||'Kafka';const api={title:'API',full:'Application Programming Interface',plain:'An API is a way for one system to ask another system for data or an action — using an agreed set of rules.',visual:'<div class="flow"><div class="box">📱 Your App</div><div class="arrow">→</div><div class="box core">API<small>agreed rules for talking</small></div><div class="arrow">→</div><div class="box">🖥 Service / Data</div></div>',example:'Your shopping app asks a payment service to charge ₹500. The API carries the request and returns success or failure.',contrast:'<strong>Don’t confuse it with Kafka.</strong> An API usually handles a direct request between systems. Kafka publishes events that multiple systems can consume independently.',rel:['REST','HTTP','JSON','Endpoint']};const kafka={title:'Kafka',full:'Event Streaming Platform',plain:'Kafka lets one system publish an event once, while many other systems can receive and react to it independently.',visual:'<div class="flow"><div class="col"><div class="box">🛒 OrderPlaced</div><div class="box">📱 App event</div><div class="box">⚙ Service event</div></div><div class="arrow">→</div><div class="box core">KAFKA<small>events are stored in an ordered stream</small></div><div class="arrow">→</div><div class="col"><div class="box">💳 Payment</div><div class="box">📊 Analytics</div><div class="box">🔔 Notification</div></div></div>',example:'An order is placed once. Payment, analytics and notifications can each react to that same event without the order system calling all three directly.',contrast:'<strong>Don’t confuse it with an API.</strong> With an API, one system usually asks another for something. With Kafka, a system publishes an event and interested consumers react to it.',rel:['Message Queue','Producer','Consumer','Topic','Event']};let x=q.toLowerCase()==='api'?api:kafka;document.getElementById(q.toLowerCase()==='api'?'ta':'tk').classList.add('active');card.innerHTML='<div class="kicker">What is it?</div><div class="titleline"><h1>'+x.title+'</h1><div class="full">'+x.full+'</div></div><div class="plain">'+x.plain+'</div><div class="visual"><div class="label">Show me</div>'+x.visual+'</div><div class="lower"><div class="example"><div class="label">Give me an example</div>'+x.example+'</div><div class="contrast"><div class="label">Don’t confuse it with…</div>'+x.contrast+'</div></div><div class="links"><div class="label">Related concepts</div>'+x.rel.map(r=>'<span class="chip">'+r+'</span>').join('')+'</div>';</script></body></html>
