<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Jargon Decoder · BodhiProtocol</title><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#10172b;--muted:#667087;--line:#e7eaf1;--accent:#6f55e8;--soft:#f3f0ff;--wash:#faf9ff;--shadow:0 18px 55px rgba(30,38,70,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}.shell{max-width:1280px;margin:auto;padding:0 22px}.nav{height:64px;border-bottom:1px solid var(--line);background:rgba(246,248,251,.94);position:sticky;top:0;z-index:20}.nav .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:850;text-decoration:none}.logo b,.label{color:var(--accent)}.back{color:var(--muted);font-size:.84rem;text-decoration:none}.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:24px 0 55px}.side,.card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.side{border-radius:24px;padding:14px;align-self:start;position:sticky;top:88px;max-height:calc(100vh - 110px);overflow:auto}.side-title,.group-title,.label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:850}.side-title{color:var(--muted);padding:3px 5px 10px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px}.group-title{color:#999fb1;padding:13px 7px 5px}.term{width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px 9px;text-align:left;cursor:pointer;margin-bottom:2px}.term.active{background:var(--wash);border-color:#ddd7ff}.term strong{font-size:.78rem}.term small{display:block;color:var(--muted);font-size:.62rem}.main{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:2px 3px 12px;color:var(--muted);font-size:.82rem}.tools{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;cursor:pointer;color:var(--muted)}.card{border-radius:28px;overflow:hidden}.hero{padding:30px;background:radial-gradient(circle at 84% 25%,var(--soft),transparent 30%),linear-gradient(120deg,var(--wash),#fff 52%);border-bottom:1px solid var(--line)}.hero h1{font-size:2rem;margin:0;letter-spacing:-.04em}.pill{display:inline-block;margin-top:6px;background:var(--soft);color:var(--accent);padding:4px 9px;border-radius:999px;font-size:.72rem}.plain{font-size:1.08rem;font-weight:750;margin-top:20px}.analogy{color:var(--muted);font-size:.86rem;margin-top:7px;font-style:italic}.content{padding:24px}.diagram{border:1px solid var(--line);border-radius:20px;padding:24px;background:linear-gradient(180deg,var(--wash),#fff);min-height:220px}.label{text-align:center}.viz{min-height:150px;display:flex;align-items:center;justify-content:center;margin-top:12px}.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.node{min-width:105px;padding:14px 12px;background:#fff;border:1px solid var(--line);border-radius:15px;text-align:center;font-size:.78rem;font-weight:800;box-shadow:0 6px 18px rgba(30,38,70,.05)}.core{background:var(--soft);border-color:#d2caff;color:var(--accent)}.arrow{color:var(--accent);font-weight:900}.stack{display:grid;gap:7px;min-width:280px}.layer{padding:10px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-size:.78rem}.layer.core{background:var(--soft)}.tables{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}.table{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:150px}.row{padding:7px 10px;border-bottom:1px solid var(--line);font-size:.72rem}.row:last-child{border:0}.row b{color:var(--accent)}.star{display:grid;grid-template-columns:repeat(3,90px);grid-template-rows:repeat(3,55px);gap:8px;place-items:center}.star .node{min-width:86px;padding:9px}.star .center{grid-column:2;grid-row:2}.cycle{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.badge{padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.74rem;font-weight:800}.numberline{display:flex;align-items:center;gap:0}.tick{width:55px;text-align:center;font-size:.72rem}.tick:before{content:'│';display:block;color:var(--accent)}.caption{text-align:center;color:var(--muted);font-size:.78rem;margin-top:12px}.three{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-top:16px}.panel{border:1px solid var(--line);border-radius:17px;padding:16px}.panel.work{background:var(--wash)}.quote{font-weight:800;margin-top:7px;font-size:.88rem}.small,.qs{font-size:.77rem;color:var(--muted)}.qs{padding-left:18px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.tag{border:0;background:var(--soft);color:var(--accent);padding:5px 9px;border-radius:999px;font-size:.7rem;margin:5px 4px 0 0;cursor:pointer}.memory{background:#fffaf0}.one{text-align:center;margin:16px auto 0;max-width:600px;padding:13px;border:1px solid #e4dfff;background:var(--wash);border-radius:18px;font-weight:800}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:360px}.three,.bottom{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:0 14px}.hero,.content{padding:20px}.hero h1{font-size:1.55rem}.back{display:none}.node{min-width:78px}.star{grid-template-columns:repeat(3,76px)}.tables{gap:10px}}</style></head><body><nav class="nav"><div class="shell"><a class="logo" href="./">Bodhi<b>Protocol</b></a><a class="back" href="./">← Jargon Decoder home</a></div></nav><div class="shell"><div class="layout"><aside class="side"><div class="side-title">Explore concepts</div><input class="search" id="search" placeholder="Search all concepts…"><div id="terms">Loading…</div></aside><main class="main"><div class="toolbar"><span>Visual learning · <b id="count">…</b></span><div class="tools"><button class="ghost" onclick="randomTerm()">↝ Random</button><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="next()">Next →</button></div></div><div id="view">Loading library…</div></main></div></div><script>const ARCHIVE='https://raw.githubusercontent.com/BodhiProtocol/technical-jargon-decoder/8853a32fe2c8bba4ad92dbfd1889e592ec8b885f/index.html';const CATS=['Software & Development','Cloud & Infrastructure','Data & Databases','Testing & QA','Architecture','Agile & Delivery'];const EXTRA=[['Kafka','Apache Kafka',2,'A distributed event-streaming platform that lets systems publish, store and consume events at scale.','Like a durable shared news feed.','OrderCreated can feed payments, analytics and notifications.',['Message Queue','Microservices','API']],['OAuth','Open Authorization',0,'A standard for giving an app limited access without sharing your password.','Like giving a valet key instead of your master key.','An app can read approved Google data without seeing your password.',['Authentication vs Authorization','API']],['Webhook','Webhook',0,'An automatic HTTP message sent when a specific event happens.','The courier texts you when the parcel arrives.','A payment provider calls your webhook after payment succeeds.',['API','REST','JSON']],['REST','Representational State Transfer',0,'A common style for designing web APIs around resources and HTTP actions.','A predictable counter: resource + action.','GET /orders reads; POST /orders creates.',['API','JSON']],['JSON','JavaScript Object Notation',2,'A lightweight text format for structured data.','A labelled form humans and software can read.','APIs commonly return fields and values as JSON.',['API','REST','SQL']],['Message Queue','Message Queue',4,'A buffer that lets systems send work for later independent processing.','A ticket tray where work waits safely.','Checkout queues an email instead of waiting for email delivery.',['Kafka','Microservices']],['DNS','Domain Name System',1,'The system that translates domain names into IP addresses.','Your contacts turning a name into a phone number.','DNS tells the browser which server hosts a domain.',['CDN','Load Balancer']],['Docker','Docker / Container',1,'A way to package an app with its dependencies so it runs consistently.','A standardized shipping container for software.','The same image runs in dev, test and production.',['Kubernetes','CI/CD']],['Git','Git / Version Control',5,'A version-control system that records file changes and supports collaboration.','A detailed history you can branch, compare and restore.','Teams commit, branch and merge reviewed code.',['CI/CD','Docker']],['SQL','Structured Query Language',2,'A language for reading, joining and changing relational data.','Asking a precise question of tables.','A BA can compare source and target records with SQL.',['Database Index','Data Lineage']],['Database Index','Database Index',2,'A structure that helps a database find rows without scanning the whole table.','A book index taking you to the right page.','An index on customer_id speeds repeated lookups.',['SQL','Cache']],['Cache','Cache',1,'A fast temporary store for frequently needed data.','Keeping common documents on your desk.','A service caches product data to avoid repeated database calls.',['CDN','Database Index']]];const ALIAS={'container (docker)':'Docker','git / version control':'Git','index (database)':'Database Index'};let data=[],current=0;function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function parse(t){let m=t.match(/const ITEMS = \[([\s\S]*?)\n\];/);return Function('return ['+m[1]+']')()}function canon(base){let out=[],seen=new Set;[...base.map(x=>ALIAS[x.t.toLowerCase()]?{...x,t:ALIAS[x.t.toLowerCase()]}:x),...EXTRA.map(x=>({t:x[0],full:x[1],c:x[2],p:x[3],a:x[4],w:x[5],m:x[3],rel:x[6]}))].forEach(x=>{let k=x.t.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(x)}});return out}const FLOW={API:['App','API','Service','Data'],Kafka:['Producer','Topic','Consumer'],OAuth:['You','Consent','Token','App'],Webhook:['Event','Webhook','App'],REST:['Client','HTTP action','Resource'],JSON:['Field','Value','Object'],'Message Queue':['Producer','Queue','Consumer'],DNS:['Domain','DNS','IP','Server'],CDN:['User','Nearby CDN','Origin'],Docker:['Code','Container','Host'],Kubernetes:['Containers','Kubernetes','Scale'],Git:['Working copy','Commit','History'],SQL:['Question','SQL','Rows'],Encryption:['Plain data','Encrypt','Ciphertext'],'Load Balancer':['Users','Load Balancer','Servers'],'Database Index':['Query','Index','Rows'],'Authentication vs Authorization':['Identity','Authentication','Authorization','Action'],'CI/CD':['Code','Build','Test','Deploy'],Cache:['Request','Cache','Source'],Microservices:['Client','Gateway','Services'],ETL:['Extract','Transform','Load'],'Data Lineage':['Source','Transform','Target'],'API Gateway':['Client','Gateway','Services'],'Message Broker':['Producer','Broker','Consumer'],'Unit Testing':['Function','Test','Pass / Fail'],'Integration Testing':['System A','Integration','System B'],'Regression Testing':['Existing feature','Change','Re-test'],'UAT':['Business need','UAT','Accept'],'User Story':['User','Need','Value'],'Acceptance Criteria':['Story','Rules','Done'],'Sprint':['Backlog','Sprint','Increment'],'CI':['Commit','Build','Test'],'CD':['Build','Deploy','Release']};function visual(x){let t=x.t;if(t==='Star Schema')return `<div class="star"><div class="node">Product</div><div class="node">Date</div><div class="node">Customer</div><div class="node core center">FACT<br>Sales</div><div class="node">Store</div></div>`;if(/Primary Key|Foreign Key/.test(t))return `<div class="tables"><div class="table"><div class="row"><b>Customer_ID 🔑</b></div><div class="row">Name</div></div><span class="arrow">→</span><div class="table"><div class="row">Order_ID 🔑</div><div class="row"><b>Customer_ID</b></div></div></div>`;if(t==='Boundary Value Analysis')return `<div class="numberline"><div class="tick">17</div><div class="tick"><b>18</b></div><div class="tick">19</div><div class="tick">64</div><div class="tick"><b>65</b></div><div class="tick">66</div></div>`;if(t==='Monolith')return `<div class="stack"><div class="layer">UI</div><div class="layer core">One application</div><div class="layer">Business logic + Data access</div></div>`;if(t==='Three-Tier Architecture')return `<div class="stack"><div class="layer">Presentation</div><div class="layer core">Business Logic</div><div class="layer">Data</div></div>`;if(t==='Agile' || t==='Scrum')return `<div class="cycle"><span class="badge">Plan</span><span class="arrow">→</span><span class="badge">Build</span><span class="arrow">→</span><span class="badge">Review</span><span class="arrow">↻</span></div>`;let ns=FLOW[t]||(x.c===2?['Question',t,'Data']:x.c===3?['Scenario',t,'Result']:x.c===1?['Request',t,'Service']:x.c===4?['Input',t,'Components']:x.c===5?['Backlog',t,'Outcome']:['Need',t,'Outcome']);return `<div class="flow">${ns.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node ${i===1?'core':''}">${esc(n)}</div>`).join('')}</div>`}function qs(x){return x.c===2?['What is the source?','How fresh is it?','How is it validated?']:x.c===3?['What are we proving?','What is expected?','Which edge cases matter?']:x.c===1?['What depends on it?','How can it fail?','How is access controlled?']:x.c===4?['What owns this?','What depends on it?','Where is the boundary?']:x.c===5?['Who owns it?','What does done mean?','What happens next?']:['What goes in?','What comes out?','What can fail?']}function side(f=''){f=f.toLowerCase();let h='';CATS.forEach((g,c)=>{let a=data.filter(x=>x.c===c&&(!f||(x.t+' '+x.full).toLowerCase().includes(f)));if(a.length)h+=`<div class="group-title">${g} · ${a.length}</div>`+a.map(x=>`<button class="term ${data.indexOf(x)===current?'active':''}" onclick="show(${data.indexOf(x)})"><strong>${esc(x.t)}</strong><small>${esc(x.full)}</small></button>`).join('')});terms.innerHTML=h||'No matching concepts.'}function render(){let x=data[current];view.innerHTML=`<article class="card"><section class="hero"><h1>${esc(x.t)}</h1><span class="pill">${esc(x.full)}</span><div class="plain">${esc(x.p)}</div><div class="analogy">💡 ${esc(x.a)}</div></section><div class="content"><section class="diagram"><div class="label">See the idea</div><div class="viz">${visual(x)}</div><div class="caption">${esc(x.m||x.p)}</div></section><div class="three"><section class="panel work"><div class="label">At work</div><div class="quote">${esc(x.w)}</div></section><section class="panel"><div class="label">BA Lens</div><ul class="qs">${qs(x).map(q=>`<li>${q}</li>`).join('')}</ul></section><section class="panel"><div class="label">Think of it like</div><div class="small">${esc(x.a)}</div></section></div><div class="bottom"><section class="panel"><div class="label">Related concepts</div>${(x.rel||[]).map(r=>`<button class="tag" onclick="go('${esc(r).replaceAll("'","\\'")}')">${esc(r)}</button>`).join('')}</section><section class="panel memory"><div class="label">Memory hook</div><div class="small">★ ${esc(x.a)}</div></section></div><div class="one">${esc(x.p)}</div></div></article>`;count.textContent=data.length+' concepts';history.replaceState(null,'','?term='+encodeURIComponent(x.t));side(search.value)}function show(i){current=i;render();scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){current=Math.floor(Math.random()*data.length);render()}function go(t){let i=data.findIndex(x=>x.t.toLowerCase()===t.toLowerCase());if(i>=0)show(i)}search.oninput=e=>side(e.target.value);fetch(ARCHIVE).then(r=>r.text()).then(t=>{data=canon(parse(t));let q=new URLSearchParams(location.search).get('term');if(q){let i=data.findIndex(x=>x.t.toLowerCase()===q.toLowerCase());if(i>=0)current=i}render()}).catch(()=>view.innerHTML='<div class="card" style="padding:40px">Library unavailable. Please refresh.</div>');</script></body></html>
