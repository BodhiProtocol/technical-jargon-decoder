<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jargon Decoder · Visual Pilot · BodhiProtocol</title><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#10172b;--muted:#667087;--line:#e7eaf1;--accent:#6f55e8;--soft:#f3f0ff;--wash:#faf9ff;--shadow:0 18px 55px rgba(30,38,70,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.shell{max-width:1280px;margin:auto;padding:0 22px}.nav{height:64px;background:rgba(246,248,251,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:850;text-decoration:none;color:var(--ink);font-size:1.05rem}.logo b{color:var(--accent)}.back{color:var(--muted);font-size:.84rem;text-decoration:none}.layout{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:24px 0 55px}.side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 30px rgba(30,38,70,.04);align-self:start;position:sticky;top:88px;max-height:calc(100vh - 110px);overflow:auto}.side-title{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);padding:5px 5px 12px}.term{width:100%;border:1px solid transparent;background:transparent;border-radius:16px;padding:11px;display:flex;gap:11px;align-items:center;text-align:left;cursor:pointer;margin-bottom:5px;color:var(--ink)}.term:hover{background:#fafbfe}.term.active{background:var(--wash);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 9%,transparent)}.ticon{width:36px;height:36px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:850;flex:none}.term strong{font-size:.84rem;display:block}.term span{font-size:.68rem;color:var(--muted);display:block;margin-top:1px}.main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:2px 3px 12px;color:var(--muted);font-size:.82rem}.tools{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;color:var(--muted);cursor:pointer}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);animation:enter .22s ease both}@keyframes enter{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}.hero{padding:28px 30px 25px;background:radial-gradient(circle at 82% 30%,var(--soft),transparent 28%),linear-gradient(120deg,var(--wash),#fff 52%);border-bottom:1px solid var(--line)}.head{display:flex;gap:15px;align-items:center}.bigicon{width:62px;height:62px;border-radius:18px;background:#fff;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;color:var(--accent);font-weight:900}.head h1{margin:0;font-size:2rem;letter-spacing:-.04em}.pill{display:inline-block;margin-top:5px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.72rem;font-weight:750;padding:4px 9px}.intro{margin-top:22px}.label{font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--accent)}.plain{font-size:1.1rem;font-weight:750;margin-top:6px}.analogy{font-size:.86rem;color:var(--muted);font-style:italic;margin-top:6px}.content{padding:24px}.diagram{border:1px solid var(--line);border-radius:20px;padding:26px;background:linear-gradient(180deg,var(--wash),#fff);box-shadow:inset 0 1px 0 #fff;min-height:190px;display:flex;flex-direction:column;justify-content:center}.diagram-title{text-align:center}.flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.node{min-width:105px;padding:14px 13px;background:#fff;border:1px solid var(--line);border-radius:15px;text-align:center;font-size:.8rem;font-weight:800;box-shadow:0 6px 18px rgba(30,38,70,.05)}.node.core{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--wash);color:var(--accent);transform:scale(1.06)}.arrow{font-size:1.1rem;color:var(--accent);font-weight:900}.caption{text-align:center;color:var(--muted);font-size:.8rem;margin-top:17px}.three{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px;margin-top:16px}.panel{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fff}.panel.work{background:linear-gradient(135deg,var(--wash),#fff)}.quote{font-weight:800;margin-top:7px;font-size:.91rem}.small{font-size:.79rem;color:var(--muted);margin-top:5px}.questions{margin:8px 0 0;padding:0;list-style:none}.questions li{font-size:.78rem;color:var(--muted);margin:5px 0}.questions li:before{content:'✓';color:var(--accent);font-weight:900;margin-right:7px}.compare{font-size:.8rem;color:var(--muted);margin-top:7px}.compare strong{color:var(--ink)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:999px;font-size:.71rem;font-weight:750}.memory{background:linear-gradient(135deg,#fff9eb,#fff);border-color:#f0e5c9}.memory .small{font-size:.84rem;color:var(--ink);font-weight:650}.one{margin:16px auto 2px;max-width:520px;text-align:center;padding:13px 20px;border-radius:999px;background:var(--wash);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));font-weight:850}.one span{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:7px;max-height:none}.side-title{display:none}.term{min-width:185px;margin:0}.three{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:0 14px}.layout{padding-top:14px}.hero{padding:22px}.content{padding:17px}.head h1{font-size:1.55rem}.bigicon{width:52px;height:52px}.back{display:none}.node{min-width:78px}.toolbar{font-size:.75rem}.one{border-radius:18px}.diagram{padding:20px}}</style></head><body><nav class="nav"><div class="shell"><a class="logo" href="https://bodhiprotocol.com/">Bodhi<b>Protocol</b></a><a class="back" href="./">← Back to Jargon Decoder</a></div></nav><div class="shell"><div class="layout"><aside class="side"><div class="side-title">Visual learning pilot</div><div id="terms"></div></aside><main class="main"><div class="toolbar"><span>Focused learning · 20 concepts</span><div class="tools"><button class="ghost" onclick="randomTerm()">↝ Random</button><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="next()">Next →</button></div></div><div id="view"></div></main></div></div><script>const D=[
['API','Application Programming Interface','API','A defined way for two systems to communicate.','A waiter carrying a request to the kitchen and bringing the response back.',['App','API','Service','Data'],1,'A request goes in. A response comes back.','“We’ll expose an API for customer details.”','Another system can request customer information through an agreed contract.',['What goes in?','What comes back?','What if it fails?'],'API = interaction · Database = storage',['REST','HTTP','JSON'],'An API is the agreed doorway.','One system asks; another responds.'],
['Kafka','Event streaming platform','K','A platform for publishing and consuming streams of events in real time.','A shared news feed where producers publish and subscribers read what matters to them.',['Producer','Kafka Topic','Consumer A','Consumer B'],1,'Publish once. Multiple consumers can react independently.','“We’ll publish order events to Kafka.”','Other systems can react without the order system calling each one directly.',['What event is published?','Who consumes it?','What if a consumer is down?'],'Kafka = event stream · API = direct request',['Events','Topics','Consumers'],'Kafka is a highway for data in motion.','Events move; systems react.'],
['Authentication vs Authorization','Identity vs permission','ID','Authentication proves who you are. Authorization decides what you can do.','Your office badge proves identity; access rules decide which doors it opens.',['Login','Identity ✓','Permission','Allow / Deny'],1,'Identity first. Permission second.','“Authenticated, but not authorized to approve.”','The system knows the user, but their role does not permit the action.',['How is identity verified?','Which roles exist?','What can each role do?'],'Authentication = who · Authorization = what',['MFA','RBAC','Roles'],'First prove identity. Then check access.','Who are you? What can you do?'],
['CI/CD','Continuous Integration / Delivery','∞','Automation that checks code changes and moves safe changes toward deployment.','A conveyor belt that inspects every change before it moves forward.',['Code','Build','Test','Deploy'],2,'Changes progress only when required checks pass.','“The CI/CD pipeline failed.”','An automated build, test or delivery step did not complete successfully.',['Which stage failed?','Which environment?','Was it deployed?'],'Deployed ≠ necessarily released',['Build','Test','Pipeline'],'CI/CD is the automated path from code to deployable software.','Build. Test. Move safely.'],
['Load Balancer','Traffic distribution','LB','A traffic controller that spreads requests across multiple servers.','A restaurant host sending arriving customers to available tables.',['Users','Load Balancer','Server A','Server B'],1,'One entrance. Traffic is distributed across capacity.','“Traffic goes through the load balancer.”','Requests are routed to available servers instead of overwhelming one machine.',['How is traffic routed?','What if a server fails?','Is health checked?'],'Load balancer = distribute · Server = process',['Traffic','Health Check','Scale'],'One entrance, many servers.','Spread the load; keep serving.'],
['Cache','Fast temporary storage','⚡','A fast copy of frequently needed data kept closer to where it is used.','Keeping your most-used items on your desk instead of walking to the cupboard every time.',['Request','Cache','Database'],1,'Check the fast copy first; fetch the source only when needed.','“That value is still in cache.”','The application may be showing a stored copy rather than freshly reading the source.',['How long is it cached?','How is it refreshed?','Can it become stale?'],'Cache = fast copy · Database = source data',['TTL','Redis','Stale Data'],'Cache trades freshness for speed.','Closer data feels faster.'],
['Database Index','Faster lookup structure','IDX','A structure that helps a database find rows without scanning everything.','The index at the back of a book: find the topic, then jump to the page.',['Query','Index','Matching Rows'],1,'Use a lookup path instead of checking every row.','“We need an index on customer_id.”','Frequent searches on that field may become much faster.',['Which queries are slow?','Which columns are searched?','What is the write cost?'],'Index = lookup aid · Table = actual records',['SQL','Query','Performance'],'An index helps the database know where to look.','Find the address before the data.'],
['OAuth','Delegated access','OA','A standard for letting one service access another on your behalf without sharing your password.','Giving a valet a limited key instead of your master key.',['You','Consent','Token','App Access'],2,'Permission is delegated through a limited token.','“Sign in and allow the app to access your calendar.”','You approve specific access without giving the app your account password.',['What scope is requested?','How long does access last?','Can it be revoked?'],'OAuth = delegated access · Password = credential',['Token','Scope','Consent'],'OAuth gives limited keys, not your master key.','Grant access without sharing the password.'],
['Webhook','Event callback','WH','A way for one system to automatically notify another when something happens.','A doorbell: instead of repeatedly checking the door, you are told when someone arrives.',['Event','Webhook','Your App'],1,'The event triggers a message to a registered destination.','“Payment will send us a webhook when it settles.”','Your system can react when the payment provider reports the event.',['Which events trigger it?','What payload arrives?','What if delivery fails?'],'Webhook = pushed event · API polling = repeated checking',['HTTP','Callback','Events'],'A webhook says: something happened.','Don’t keep asking; get notified.'],
['Microservices','Independent business services','μ','An application split into services that each own a specific capability.','A food court: separate counters, each responsible for one job.',['Customer','Order','Payment','Notification'],1,'A customer journey can cross independently owned services.','“Payment is handled by a separate microservice.”','Payment logic lives in its own independently managed service.',['Which service owns the rule?','What depends on it?','How do services communicate?'],'Microservice = responsibility boundary · not just small code',['API','Events','Domain'],'Each service owns a clear capability.','Split by responsibility, not size.'],
['REST','API design style','REST','A common way to design web APIs around resources and standard HTTP actions.','A predictable counter where GET reads, POST creates and DELETE removes.',['Client','HTTP Verb','Resource','Response'],2,'Standard actions make an API easier to understand.','“Call GET /customers/42.”','The client is requesting the customer resource with ID 42.',['What resource?','Which HTTP method?','Which status codes?'],'REST = design style · HTTP = transport protocol',['GET','POST','Status Code'],'REST makes web interactions predictable.','Resources + standard actions.'],
['JSON','Structured text format','{}','A lightweight text format used to represent structured data.','A labelled box: each value has a name so another system knows what it means.',['Field','Value','JSON Object'],2,'Named fields make data portable between systems.','“The API returns JSON.”','The response arrives as structured key-value data applications can parse.',['Which fields are mandatory?','What are the data types?','Can fields be null?'],'JSON = data format · API = communication interface',['Payload','Schema','API'],'JSON labels data so machines can exchange it.','Keys describe values.'],
['Message Queue','Asynchronous messaging','MQ','A buffer where messages wait until another system is ready to process them.','A ticket queue: work waits in order until someone is available.',['Producer','Queue','Consumer'],1,'Sender and receiver do not need to work at the same moment.','“Put the request on the queue.”','The sender can continue while another process handles the message later.',['What is queued?','How long can it wait?','What happens on failure?'],'Queue = buffered work · API = immediate interaction',['Async','Retry','Consumer'],'A queue separates sending from processing.','Send now; process when ready.'],
['DNS','Domain Name System','DNS','The system that translates human-friendly domain names into network addresses.','Your phone contacts: you choose a name; the phone finds the number.',['bodhiprotocol.com','DNS','IP Address','Server'],1,'Names are resolved to addresses computers can route to.','“DNS is not resolving.”','The name cannot currently be translated to the server address.',['Which record?','Has DNS changed?','Has it propagated?'],'DNS = name lookup · Hosting = where site runs',['Domain','IP','Record'],'DNS is the internet’s address book.','Name in; address out.'],
['CDN','Content Delivery Network','CDN','A network that serves content from locations closer to users.','Keeping copies of a popular book in local libraries instead of one distant warehouse.',['Origin','CDN Edge','Nearby User'],1,'Popular content is delivered from a closer edge location.','“Static assets are served through the CDN.”','Images and files can reach users faster without every request hitting the origin.',['What is cached?','How is it invalidated?','Where is the origin?'],'CDN = distributed delivery · Server = origin compute',['Edge','Cache','Latency'],'A CDN moves content closer to users.','Less distance, faster delivery.'],
['Docker','Application containers','D','A way to package an application with what it needs so it runs consistently.','Packing the same ready-to-use travel kit wherever you go.',['Code','Docker Image','Container','Run'],1,'Package once; run the same bundle across environments.','“It works in the Docker container.”','The application and its dependencies are running in an isolated packaged environment.',['What image version?','Which configuration?','Which ports?'],'Container = packaged process · VM = full virtual machine',['Image','Container','Registry'],'Docker packages the app with its environment.','Same package, different machine.'],
['Kubernetes','Container orchestration','K8s','A system that deploys, scales and keeps groups of containers running.','An operations manager assigning staff, replacing absences and adding people when demand rises.',['Desired State','Kubernetes','Pods','Healthy Service'],1,'It continually works to keep the running system matching the desired state.','“Kubernetes restarted the pod.”','The platform detected a problem and replaced a container workload.',['How many replicas?','What are health checks?','What happens during rollout?'],'Kubernetes = orchestrates · Docker = packages',['Pod','Cluster','Deployment'],'Kubernetes keeps container workloads in the desired state.','Declare what you want; it keeps it running.'],
['Git','Version control','Git','A system that records changes to files so teams can collaborate and history can be recovered.','Track Changes with a complete timeline and parallel copies of the work.',['Edit','Commit','Branch','Merge'],1,'Changes are saved as history and combined deliberately.','“Push your branch and open a PR.”','Publish your line of changes so it can be reviewed and merged.',['Which branch?','What changed?','Are there conflicts?'],'Git = version control · GitHub = collaboration platform',['Commit','Branch','Merge'],'Git remembers how the code changed.','Change safely; keep the history.'],
['SQL','Database query language','SQL','A language used to ask relational databases for data and change it.','Giving a librarian precise instructions about which records you want.',['SQL Query','Database','Rows'],1,'A structured request selects or changes matching data.','“Run a SQL query for failed orders.”','Ask the database to return records matching defined conditions.',['Which tables?','Which filters?','How are tables joined?'],'SQL = query language · Database = data system',['SELECT','JOIN','WHERE'],'SQL tells a relational database what data you want.','Ask precisely; get matching rows.'],
['Encryption','Protecting readable data','🔒','A process that transforms readable data into a form that requires a key to understand.','Locking a message in a box that only someone with the right key can open.',['Plain Data','Encrypt + Key','Ciphertext','Decrypt'],1,'Readable information becomes protected ciphertext.','“Customer data is encrypted at rest.”','Stored data is protected so raw files are not directly readable without the key.',['Where is encryption applied?','Who manages keys?','Is data protected in transit too?'],'Encryption = reversible with key · Hashing = one-way',['TLS','Keys','Ciphertext'],'Encryption protects meaning with a key.','Readable in; protected out.']];
const colors=['#6f55e8','#159447','#1679c4','#df7a13','#7c4dcc','#b65b18','#2672e5','#9b4aa3','#00867a','#2672e5','#1469b8','#9b5b16','#6b5bd2','#137f77','#3b73d1','#2874a6','#315bd8','#e05a47','#3a70b2','#6f55e8'];const data=D.map((x,i)=>({n:x[0],f:x[1],icon:x[2],p:x[3],a:x[4],nodes:x[5],core:x[6],cap:x[7],work:x[8],meaning:x[9],qs:x[10],dont:x[11],tags:x[12],mem:x[13],one:x[14],color:colors[i],soft:'#f3f5ff',wash:'#fafbff'}));let current=0;const terms=document.getElementById('terms'),view=document.getElementById('view');function e(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function render(){const t=data[current];document.documentElement.style.setProperty('--accent',t.color);document.documentElement.style.setProperty('--soft',t.soft);document.documentElement.style.setProperty('--wash',t.wash);terms.innerHTML=data.map((x,i)=>`<button class="term ${i===current?'active':''}" onclick="show(${i})"><span class="ticon">${e(x.icon)}</span><span><strong>${e(x.n)}</strong><span>${e(x.f)}</span></span></button>`).join('');view.innerHTML=`<article class="card"><section class="hero"><div class="head"><div class="bigicon">${e(t.icon)}</div><div><h1>${e(t.n)}</h1><span class="pill">${e(t.f)}</span></div></div><div class="intro"><div class="label">1 · Plain English</div><div class="plain">${e(t.p)}</div><div class="analogy">💡 ${e(t.a)}</div></div></section><div class="content"><section class="diagram"><div class="label diagram-title">2 · See how it works</div><div class="flow">${t.nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node ${i===t.core?'core':''}">${e(n)}</div>`).join('')}</div><div class="caption">${e(t.cap)}</div></section><div class="three"><section class="panel work"><div class="label">3 · At work</div><div class="quote">${e(t.work)}</div><div class="small">${e(t.meaning)}</div></section><section class="panel"><div class="label">4 · BA Lens</div><ul class="questions">${t.qs.map(q=>`<li>${e(q)}</li>`).join('')}</ul></section><section class="panel"><div class="label">5 · Don’t confuse</div><div class="compare"><strong>${e(t.dont)}</strong></div></section></div><div class="bottom"><section class="panel"><div class="label">Related concepts</div><div class="tags">${t.tags.map(x=>`<span class="tag">${e(x)}</span>`).join('')}</div></section><section class="panel memory"><div class="label">Memory hook</div><div class="small">★ ${e(t.mem)}</div></section></div><div class="one"><span>One thing to remember</span>${e(t.one)}</div></div></article>`;history.replaceState(null,'',`${location.pathname}?term=${encodeURIComponent(t.n)}`)}function show(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){let n=current;while(n===current)n=Math.floor(Math.random()*data.length);current=n;render()}const wanted=new URLSearchParams(location.search).get('term');if(wanted){const i=data.findIndex(x=>x.n.toLowerCase()===wanted.toLowerCase());if(i>=0)current=i}render();</script></body></html>
