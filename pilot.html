e(t.d)}</div></section></div><div class="bottom"><section class="panel"><div class="label">Related concepts</div><div class="tags">${t.tags.map(x=>`<span class="tag">${e(x)}</span>`).join('')}</div></section><section class="panel memory"><div class="label">Memory hook</div><div class="small">★ ${e(t.mem)}</div></section></div><div class="one"><span>One thing to remember</span>${e(t.one)}</div></div></article>`;history.replaceState(null,'',`?term=${encodeURIComponent(t.n)}`);renderNav(search.value)}function show(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){let n=current;while(n===current)n=Math.floor(Math.random()*data.length);current=n;render()}search.addEventListener('input',()=>renderNav(search.value));const wanted=new URLSearchParams(location.search).get('term');if(wanted){const i=data.findIndex(x=>x.n.toLowerCase()===wanted.toLowerCase());if(i>=0)current=i}render();</script></body></html>
