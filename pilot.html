<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Jargon Decoder · BodhiProtocol</title><meta name="description" content="Technical concepts explained visually, in plain English."><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#10172b;--muted:#667087;--line:#e7eaf1;--accent:#6f55e8;--soft:#f3f0ff;--wash:#faf9ff;--shadow:0 18px 55px rgba(30,38,70,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.shell{max-width:1280px;margin:auto;padding:0 22px}.nav{height:64px;background:rgba(246,248,251,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:850;text-decoration:none;color:var(--ink)}.logo b{color:var(--accent)}.back{color:var(--muted);font-size:.84rem;text-decoration:none}.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:24px 0 55px}.side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 8px 30px rgba(30,38,70,.04);align-self:start;position:sticky;top:88px;max-height:calc(100vh - 110px);overflow:auto}.side-title{font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);padding:3px 5px 10px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:10px;font:inherit;font-size:.79rem;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}.group-title{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#9a9fb0;font-weight:850;padding:13px 7px 5px}.term{width:100%;border:1px solid transparent;background:transparent;border-radius:13px;padding:8px 9px;display:flex;gap:9px;align-items:center;text-align:left;cursor:pointer;margin-bottom:2px;color:var(--ink)}.term:hover{background:#fafbfe}.term.active{background:var(--wash);border-color:#ddd7ff}.ticon{width:31px;height:31px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:850;flex:none;font-size:.68rem}.term strong{font-size:.78rem;display:block}.term small{font-size:.62rem;color:var(--muted);display:block;margin-top:1px}.main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:2px 3px 12px;color:var(--muted);font-size:.82rem}.tools{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;color:var(--muted);cursor:pointer}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}.hero{padding:30px;background:radial-gradient(circle at 84% 25%,var(--soft),transparent 30%),linear-gradient(120deg,var(--wash),#fff 52%);border-bottom:1px solid var(--line)}.head{display:flex;gap:15px;align-items:center}.bigicon{width:62px;height:62px;border-radius:18px;background:#fff;border:1px solid #ddd7ff;display:grid;place-items:center;color:var(--accent);font-weight:900}.head h1{margin:0;font-size:2rem;letter-spacing:-.04em}.pill{display:inline-block;margin-top:5px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.72rem;font-weight:750;padding:4px 9px}.plain{font-size:1.08rem;font-weight:750;margin-top:22px}.analogy{font-size:.86rem;color:var(--muted);font-style:italic;margin-top:7px}.content{padding:24px}.label{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--accent)}.diagram{border:1px solid var(--line);border-radius:20px;padding:26px;background:linear-gradient(180deg,var(--wash),#fff);min-height:200px;display:flex;flex-direction:column;justify-content:center}.diagram-title{text-align:center}.visual{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.node{min-width:105px;padding:14px 12px;background:#fff;border:1px solid var(--line);border-radius:15px;text-align:center;font-size:.78rem;font-weight:800;box-shadow:0 6px 18px rgba(30,38,70,.05)}.node.core{background:var(--soft);border-color:#d2caff;color:var(--accent)}.arrow{color:var(--accent);font-weight:900}.caption{text-align:center;color:var(--muted);font-size:.79rem;margin-top:16px}.three{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-top:16px}.panel{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fff}.panel.work{background:linear-gradient(135deg,var(--wash),#fff)}.quote{font-weight:800;margin-top:7px;font-size:.9rem}.small{font-size:.78rem;color:var(--muted);margin-top:6px}.qs{margin:8px 0 0;padding:0;list-style:none}.qs li{font-size:.77rem;color:var(--muted);margin:5px 0}.qs li:before{content:'✓';color:var(--accent);font-weight:900;margin-right:7px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:var(--soft);color:var(--accent);padding:5px 9px;border-radius:999px;font-size:.7rem;font-weight:750;cursor:pointer;border:0}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.memory{background:#fffaf0;border-color:#efe3c6}.one{margin:16px auto 2px;max-width:560px;text-align:center;padding:13px 20px;border-radius:999px;background:var(--wash);border:1px solid #e4dfff;font-weight:850}.one span{display:block;font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}.loading{padding:60px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.three,.bottom{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:0 14px}.hero{padding:22px}.content{padding:17px}.head h1{font-size:1.55rem}.bigicon{width:52px;height:52px}.back{display:none}.node{min-width:80px}.toolbar{font-size:.74rem}.one{border-radius:18px}}</style></head><body><nav class="nav"><div class="shell"><a class="logo" href="./">Bodhi<b>Protocol</b></a><a class="back" href="./">← Jargon Decoder home</a></div></nav><div class="shell"><div class="layout"><aside class="side"><div class="side-title">Explore concepts</div><input class="search" id="sideSearch" placeholder="Search all concepts…"><div id="terms"><div class="loading">Loading library…</div></div></aside><main class="main"><div class="toolbar"><span>Visual learning · <b id="count">loading…</b></span><div class="tools"><button class="ghost" onclick="randomTerm()">↝ Random</button><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="next()">Next →</button></div></div><div id="view"><div class="card loading">Loading the full concept library…</div></div></main></div></div><script>const ARCHIVE='https://raw.githubusercontent.com/BodhiProtocol/technical-jargon-decoder/8853a32fe2c8bba4ad92dbfd1889e592ec8b885f/index.html';const CATN=['Software & Development','Cloud & Infrastructure','Data & Databases','Testing & QA','Architecture','Agile & Delivery'];let data=[],current=0;const curated={API:['App','API','Service','Data'],Kafka:['Producer','Topic','Consumer'],OAuth:['You','Consent','Token','App'],Webhook:['Event','Webhook','App'],Microservices:['Customer','Service A','Service B'],REST:['Client','HTTP action','Resource'],JSON:['Field','Value','Object'],'Message Queue':['Producer','Queue','Consumer'],DNS:['Domain','DNS','IP','Server'],CDN:['User','Nearby CDN','Origin'],Docker:['Code','Container','Host'],Kubernetes:['Containers','Kubernetes','Scale'],Git:['Working copy','Commit','History'],SQL:['Question','SQL','Rows'],Encryption:['Plain data','Encrypt','Ciphertext'],'Load Balancer':['Users','Load Balancer','Servers'],'Database Index':['Query','Index','Rows'],'Authentication vs Authorization':['Identity','Authentication','Authorization','Action'],'CI/CD':['Code','Build','Test','Deploy'],Cache:['Request','Cache','Source']};function e(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function parseArchive(txt){const m=txt.match(/const ITEMS = \[([\s\S]*?)\n\];/);if(!m)throw Error('Library data not found');return Function('return ['+m[1]+']')()}function icon(t){return t.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()||'•'}function visualNodes(x){if(curated[x.t])return curated[x.t];if(x.c===2)return ['Question',x.t,'Data'];if(x.c===3)return ['Scenario',x.t,'Result'];if(x.c===5)return ['Backlog',x.t,'Outcome'];if(x.c===1)return ['Request',x.t,'Service'];if(x.c===4)return ['Input',x.t,'Components'];return ['Need',x.t,'Outcome']}function questions(x){const q=[];if(x.c===0)q.push('What goes in?','What comes out?','What can fail?');if(x.c===1)q.push('What depends on it?','How does it fail?','How is access controlled?');if(x.c===2)q.push('What is the source?','How fresh is it?','How is it validated?');if(x.c===3)q.push('What are we proving?','What is the expected result?','What edge cases matter?');if(x.c===4)q.push('What owns this?','What depends on it?','Where is the boundary?');if(x.c===5)q.push('Who owns it?','What does done mean?','What is the next decision?');return q}function renderSide(filter=''){const f=filter.toLowerCase();let h='';CATN.forEach((g,ci)=>{const list=data.filter(x=>x.c===ci&&(!f||(x.t+' '+x.full).toLowerCase().includes(f)));if(!list.length)return;h+=`<div class="group-title">${e(g)} · ${list.length}</div>`+list.map(x=>{const i=data.indexOf(x);return `<button class="term ${i===current?'active':''}" onclick="show(${i})"><span class="ticon">${e(icon(x.t))}</span><span><strong>${e(x.t)}</strong><small>${e(x.full)}</small></span></button>`}).join('')});document.getElementById('terms').innerHTML=h||'<div class="loading">No matching concepts.</div>'}function render(){const x=data[current];if(!x)return;const ns=visualNodes(x),core=Math.min(1,ns.length-1);document.getElementById('view').innerHTML=`<article class="card"><section class="hero"><div class="head"><div class="bigicon">${e(icon(x.t))}</div><div><h1>${e(x.t)}</h1><span class="pill">${e(x.full)}</span></div></div><div class="plain">${e(x.p)}</div><div class="analogy">💡 ${e(x.a)}</div></section><div class="content"><section class="diagram"><div class="label diagram-title">See the idea</div><div class="visual">${ns.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node ${i===core?'core':''}">${e(n)}</div>`).join('')}</div><div class="caption">${e(x.m)}</div></section><div class="three"><section class="panel work"><div class="label">At work</div><div class="quote">${e(x.w)}</div></section><section class="panel"><div class="label">BA Lens</div><ul class="qs">${questions(x).map(q=>`<li>${e(q)}</li>`).join('')}</ul></section><section class="panel"><div class="label">Think of it like</div><div class="small">${e(x.a)}</div></section></div><div class="bottom"><section class="panel"><div class="label">Related concepts</div><div class="tags">${(x.rel||[]).map(r=>`<button class="tag" onclick="goto('${e(r).replaceAll("'","\\'")}')">${e(r)}</button>`).join('')}</div></section><section class="panel memory"><div class="label">Memory hook</div><div class="small">★ ${e(x.a)}</div></section></div><div class="one"><span>One thing to remember</span>${e(x.p)}</div></div></article>`;document.getElementById('count').textContent=data.length+' concepts';history.replaceState(null,'','?term='+encodeURIComponent(x.t));renderSide(document.getElementById('sideSearch').value)}function show(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){current=Math.floor(Math.random()*data.length);render()}function goto(t){const i=data.findIndex(x=>x.t.toLowerCase()===String(t).toLowerCase());if(i>=0)show(i)}document.getElementById('sideSearch').addEventListener('input',e=>renderSide(e.target.value));fetch(ARCHIVE).then(r=>{if(!r.ok)throw Error('Archive unavailable');return r.text()}).then(txt=>{data=parseArchive(txt);const wanted=new URLSearchParams(location.search).get('term');if(wanted){const i=data.findIndex(x=>x.t.toLowerCase()===wanted.toLowerCase());if(i>=0)current=i}render()}).catch(err=>{document.getElementById('view').innerHTML='<div class="card loading">Could not load the concept library. Please refresh.</div>';document.getElementById('terms').innerHTML='<div class="loading">Library unavailable.</div>';console.error(err)});</script></body></html>
