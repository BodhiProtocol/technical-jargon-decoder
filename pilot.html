<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Jargon Decoder · BodhiProtocol</title><style>:root{--bg:#f6f8fb;--ink:#10172b;--muted:#667087;--line:#e4e9ed;--accent:#168b62;--soft:#eef9f4;--blue:#2879d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.nav{height:62px;border-bottom:1px solid var(--line);background:#fff}.shell{max-width:1450px;margin:auto;padding:0 24px}.nav .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:850;text-decoration:none;color:var(--ink)}.logo b{color:#6f55e8}.back{font-size:.8rem;color:var(--muted);text-decoration:none}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 0 45px}.side,.lesson{background:#fff;border:1px solid var(--line);border-radius:18px}.side{padding:12px;position:sticky;top:18px;align-self:start;max-height:calc(100vh - 38px);overflow:auto}.side-title,.group-title,.eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;font-weight:850;color:var(--muted)}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:10px 0;font:inherit;font-size:.8rem}.group-title{padding:12px 6px 5px}.term{width:100%;border:0;background:transparent;text-align:left;padding:7px;border-radius:9px;cursor:pointer}.term:hover,.term.active{background:var(--soft)}.term strong{display:block;font-size:.78rem}.term small{font-size:.62rem;color:var(--muted)}.main{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:1px 2px 10px;color:var(--muted);font-size:.78rem}.tools{display:flex;gap:6px}.ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.lesson{padding:0 28px}.lesson-head{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,2.15fr);gap:32px;align-items:start;padding:24px 0 18px;border-bottom:1px solid var(--line)}.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.82rem}.lesson h1{margin:0;font-size:1.65rem;letter-spacing:-.035em}.expansion{font-size:.72rem;color:var(--accent);font-weight:800}.plain-label{font-size:.68rem;font-weight:850;margin-bottom:7px}.plain{font-size:.92rem;line-height:1.55;max-width:800px}.visual-row{display:grid;grid-template-columns:minmax(180px,.65fr) minmax(0,2.35fr);gap:32px;padding:20px 0;align-items:center}.analogy{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:10px}.diagram-wrap{min-height:245px;display:flex;align-items:center;justify-content:center}.flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.node{min-width:120px;padding:15px 12px;background:#fff;border:1px solid var(--line);border-radius:13px;text-align:center;font-size:.8rem;font-weight:800}.core{background:var(--soft);border-color:#bfe6d7;color:var(--accent)}.arrow{font-size:1.2rem;color:var(--muted);font-weight:900}.related{border-top:1px solid var(--line);padding:12px 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.related b{font-size:.68rem}.tag{border:1px solid #cfe9df;background:#f7fcfa;color:var(--accent);padding:5px 10px;border-radius:999px;font-size:.66rem;cursor:pointer}.more{border-top:1px solid var(--line);padding:12px 0 18px}.more summary{cursor:pointer;font-size:.72rem;font-weight:850;color:var(--muted)}.more-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-top:12px}.panel{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.76rem;line-height:1.5}.panel b{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:6px}.api-map{width:min(800px,100%);display:grid;grid-template-columns:1fr 115px 1fr;align-items:center;gap:20px}.api-box{border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;font-size:.8rem;font-weight:850;background:#fff}.api-center{width:105px;height:105px;border:1px solid #a8d4f7;background:#f0f8ff;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--blue);font-weight:900;font-size:1.25rem}.api-center small{display:block;font-size:.58rem;color:var(--muted)}.api-arrows{grid-column:1/-1;display:grid;grid-template-columns:1fr 115px 1fr;gap:20px;text-align:center;font-size:.68rem;color:var(--muted)}.api-arrows b{color:var(--blue)}.kafka-map{width:min(850px,100%);display:grid;grid-template-columns:160px 42px 1fr 42px 170px;align-items:center;gap:8px}.k-col{display:grid;gap:8px}.k-card{border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-size:.72rem;font-weight:800;background:#fff}.k-topic{border:1px solid #bfe6d7;background:var(--soft);border-radius:16px;padding:20px;text-align:center;color:var(--accent);font-weight:900}.events{display:flex;justify-content:center;gap:5px;margin-top:10px}.event{width:30px;height:24px;border:1px solid #bfe6d7;background:#fff;border-radius:5px;display:grid;place-items:center;font-size:.62rem}.connector{text-align:center;color:var(--accent);font-size:1.5rem;font-weight:900}.k-label{text-align:center;font-size:.66rem;color:var(--muted);font-weight:800;margin-bottom:6px}.pipeline{display:grid;grid-template-columns:repeat(9,auto);gap:9px;align-items:center;justify-content:center}.pstep{width:100px;height:82px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:.72rem;font-weight:850;background:#fff}.pstep strong{font-size:1.25rem}.pstep.final{background:var(--soft);color:var(--accent);border-color:#bfe6d7}.parrow{font-weight:900;color:var(--muted)}.auth-map{display:grid;grid-template-columns:1fr 40px 1fr;gap:12px;width:min(800px,100%);align-items:center}.auth-box{border:1px solid #cfe9df;background:#f7fcfa;border-radius:14px;padding:18px}.auth-head{font-size:.8rem;font-weight:900;color:var(--accent);margin-bottom:10px}.auth-step{font-size:.7rem;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0}.boundary{width:min(800px,100%)}.numline{height:7px;background:linear-gradient(90deg,#f3cccc 0 20%,#ccebdc 20% 80%,#f3cccc 80%);border-radius:99px;position:relative;margin:45px 30px}.mark{position:absolute;top:-27px;transform:translateX(-50%);font-size:.68rem;font-weight:850}.mark:after{content:'';display:block;width:2px;height:34px;background:#333;margin:5px auto}.m17{left:7%}.m18{left:20%}.m19{left:32%}.m59{left:68%}.m60{left:80%}.m61{left:93%}.test-note{text-align:center;font-size:.72rem;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:280px}.lesson-head,.visual-row{grid-template-columns:1fr}.more-grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:0 12px}.lesson{padding:0 16px}.api-map{grid-template-columns:1fr 75px 1fr;gap:7px}.api-center{width:72px;height:72px;font-size:.9rem}.api-arrows{display:none}.kafka-map{grid-template-columns:1fr}.connector{transform:rotate(90deg)}.pipeline{grid-template-columns:1fr 18px 1fr 18px 1fr}.pstep{width:72px}.auth-map{grid-template-columns:1fr}.visual-row{gap:10px}}</style></head><body><nav class="nav"><div class="shell"><a class="logo" href="./">Bodhi<b>Protocol</b></a><a class="back" href="./">← Jargon Decoder home</a></div></nav><div class="shell"><div class="layout"><aside class="side"><div class="side-title">Explore concepts</div><input id="search" class="search" placeholder="Search all concepts…"><div id="terms">Loading…</div></aside><main class="main"><div class="toolbar"><span>Visual learning · <b id="count">…</b></span><div class="tools"><button class="ghost" onclick="randomTerm()">↝ Random</button><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="next()">Next →</button></div></div><div id="view">Loading…</div></main></div></div><script>const ARCHIVE='https://raw.githubusercontent.com/BodhiProtocol/technical-jargon-decoder/8853a32fe2c8bba4ad92dbfd1889e592ec8b885f/index.html';const CATS=['Software & Development','Cloud & Infrastructure','Data & Databases','Testing & QA','Architecture','Agile & Delivery'];const EXTRA=[['Kafka','Apache Kafka',2,'A distributed event-streaming platform that lets systems publish, store and consume events at scale.','Like a durable shared news feed.','OrderCreated can feed payments, analytics and notifications.',['Message Queue','Microservices','API']],['OAuth','Open Authorization',0,'A standard for giving an app limited access without sharing your password.','Like giving a valet key instead of your master key.','An app can read approved Google data without seeing your password.',['Authentication vs. Authorization','API']],['Webhook','Webhook',0,'An automatic HTTP message sent when a specific event happens.','The courier texts you when the parcel arrives.','A payment provider calls your webhook after payment succeeds.',['API','REST','JSON']],['REST','Representational State Transfer',0,'A common style for designing web APIs around resources and HTTP actions.','A predictable counter: resource + action.','GET /orders reads; POST /orders creates.',['API','JSON']],['JSON','JavaScript Object Notation',2,'A lightweight text format for structured data.','A labelled form humans and software can read.','APIs commonly return fields and values as JSON.',['API','REST','SQL']],['Message Queue','Message Queue',4,'A buffer that lets systems send work for later independent processing.','A ticket tray where work waits safely.','Checkout queues an email instead of waiting for email delivery.',['Kafka','Microservices']],['DNS','Domain Name System',1,'The system that translates domain names into IP addresses.','Your contacts turning a name into a phone number.','DNS tells the browser which server hosts a domain.',['CDN','Load Balancer']],['Docker','Docker / Container',1,'A way to package an app with its dependencies so it runs consistently.','A standardized shipping container for software.','The same image runs in dev, test and production.',['Kubernetes','CI/CD']],['Git','Git / Version Control',5,'A version-control system that records file changes and supports collaboration.','A detailed history you can branch, compare and restore.','Teams commit, branch and merge reviewed code.',['CI/CD','Docker']],['SQL','Structured Query Language',2,'A language for reading, joining and changing relational data.','Asking a precise question of tables.','A BA can compare source and target records with SQL.',['Database Index','Data Lineage']],['Database Index','Database Index',2,'A structure that helps a database find rows without scanning the whole table.','A book index taking you to the right page.','An index on customer_id speeds repeated lookups.',['SQL','Cache']],['Cache','Cache',1,'A fast temporary store for frequently needed data.','Keeping common documents on your desk.','A service caches product data to avoid repeated database calls.',['CDN','Database Index']]];const ALIAS={'container (docker)':'Docker','git / version control':'Git','index (database)':'Database Index'};let data=[],current=0;function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}function parse(t){let m=t.match(/const ITEMS = \[([\s\S]*?)\n\];/);if(!m)throw Error('Library data not found');return Function('return ['+m[1]+']')()}function canon(base){let out=[],seen=new Set;[...base.map(x=>ALIAS[x.t.toLowerCase()]?{...x,t:ALIAS[x.t.toLowerCase()]}:x),...EXTRA.map(x=>({t:x[0],full:x[1],c:x[2],p:x[3],a:x[4],w:x[5],rel:x[6]}))].forEach(x=>{let k=norm(x.t);if(!seen.has(k)){seen.add(k);out.push(x)}});return out}const FLOW={OAuth:['You','Consent','Token','App'],Webhook:['Event','Webhook','App'],REST:['Client','HTTP action','Resource'],JSON:['Field','Value','Object'],'Message Queue':['Producer','Queue','Consumer'],DNS:['Domain','DNS','IP','Server'],CDN:['User','Nearby CDN','Origin'],Docker:['Code','Container','Host'],Kubernetes:['Containers','Kubernetes','Scale'],Git:['Working copy','Commit','History'],SQL:['Question','SQL','Rows'],Encryption:['Plain data','Encrypt','Ciphertext'],'Load Balancer':['Users','Load Balancer','Servers'],'Database Index':['Query','Index','Rows'],Cache:['Request','Cache','Source'],Microservices:['Client','Gateway','Services'],ETL:['Extract','Transform','Load'],'Data Lineage':['Source','Transform','Target'],'API Gateway':['Client','Gateway','Services'],'Unit Testing':['Function','Test','Pass / Fail'],'Integration Testing':['System A','Integration','System B'],'Regression Testing':['Existing feature','Change','Re-test'],UAT:['Business need','UAT','Accept'],'User Story':['User','Need','Value'],'Acceptance Criteria':['Story','Rules','Done'],Sprint:['Backlog','Sprint','Increment']};function bespoke(t){const n=norm(t);if(n==='api')return `<div class="api-map"><div class="api-box">📱<br>Your App</div><div class="api-center">API<small>the messenger</small></div><div class="api-box">🖥️<br>Service / System<br>＋ Data</div><div class="api-arrows"><div><b>Request →</b><br>ask for data</div><div>contract</div><div><b>← Response</b><br>result returns</div></div></div>`;if(n==='kafka')return `<div class="kafka-map"><div><div class="k-label">Producers</div><div class="k-col"><div class="k-card">🛒 Orders</div><div class="k-card">📱 App events</div><div class="k-card">⚙️ Services</div></div></div><div class="connector">→</div><div class="k-topic">Kafka Topic<div class="events"><span class="event">✉</span><span class="event">✉</span><span class="event">✉</span><span class="event">✉</span></div><div style="font-size:.62rem;color:var(--muted);margin-top:8px">durable event stream</div></div><div class="connector">→</div><div><div class="k-label">Consumers</div><div class="k-col"><div class="k-card">Analytics</div><div class="k-card">Database</div><div class="k-card">Monitoring</div></div></div></div>`;if(n==='cicd')return `<div class="pipeline"><div class="pstep"><strong>⌨</strong>Code</div><div class="parrow">→</div><div class="pstep"><strong>⚙</strong>Build</div><div class="parrow">→</div><div class="pstep"><strong>✓</strong>Test</div><div class="parrow">→</div><div class="pstep"><strong>🚀</strong>Deploy</div><div class="parrow">→</div><div class="pstep final"><strong>▣</strong>Production</div></div>`;if(n==='authenticationvsauthorization')return `<div class="auth-map"><div class="auth-box"><div class="auth-head">Authentication · Who are you?</div><div class="auth-step">👤 Identity proof</div><div class="auth-step">✓ Identity verified</div></div><div class="connector">→</div><div class="auth-box"><div class="auth-head">Authorization · What can you do?</div><div class="auth-step">🔑 Role / permissions</div><div class="auth-step">✓ Access allowed</div></div></div>`;if(n==='boundaryvalueanalysis')return `<div class="boundary"><div class="numline"><span class="mark m17">17</span><span class="mark m18">18</span><span class="mark m19">19</span><span class="mark m59">59</span><span class="mark m60">60</span><span class="mark m61">61</span></div><div class="test-note">Test just below, at, and just above each boundary.</div></div>`;return ''}function visual(x){let b=bespoke(x.t);if(b)return b;let ns=FLOW[x.t]||(x.c===2?['Question',x.t,'Data']:x.c===3?['Scenario',x.t,'Result']:x.c===1?['Request',x.t,'Service']:x.c===4?['Input',x.t,'Components']:x.c===5?['Backlog',x.t,'Outcome']:['Need',x.t,'Outcome']);return `<div class="flow">${ns.map((v,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node ${i===1?'core':''}">${esc(v)}</div>`).join('')}</div>`}function qs(x){return x.c===2?['What is the source?','How fresh is it?','How is it validated?']:x.c===3?['What are we proving?','What is expected?','Which edge cases matter?']:x.c===1?['What depends on it?','How can it fail?','How is access controlled?']:['What goes in?','What comes out?','What can fail?']}function side(f=''){f=norm(f);let h='';CATS.forEach((g,c)=>{let a=data.filter(x=>x.c===c&&(!f||norm(x.t+' '+x.full).includes(f)));if(a.length)h+=`<div class="group-title">${g} · ${a.length}</div>`+a.map(x=>`<button class="term ${data.indexOf(x)===current?'active':''}" onclick="show(${data.indexOf(x)})"><strong>${esc(x.t)}</strong><small>${esc(x.full)}</small></button>`).join('')});document.getElementById('terms').innerHTML=h||'No matching concepts.'}function render(){let x=data[current];document.getElementById('view').innerHTML=`<article class="lesson"><section class="lesson-head"><div><div class="title-row"><span class="num">${current+1}</span><h1>${esc(x.t)}</h1><span class="expansion">${esc(x.full)}</span></div></div><div><div class="plain-label">Plain English</div><div class="plain">${esc(x.p)}</div></div></section><section class="visual-row"><div><div class="eyebrow">See the concept</div><div class="analogy">💡 ${esc(x.a)}</div></div><div class="diagram-wrap">${visual(x)}</div></section><section class="related"><b>Related Concepts:</b>${(x.rel||[]).map(r=>`<button class="tag" data-rel="${encodeURIComponent(r)}">${esc(r)}</button>`).join('')}</section><details class="more"><summary>More context · At Work · BA Lens · Memory Hook</summary><div class="more-grid"><div class="panel"><b>At Work</b>${esc(x.w)}</div><div class="panel"><b>BA Lens</b>${qs(x).map(q=>'• '+esc(q)).join('<br>')}</div><div class="panel"><b>Remember This</b>${esc(x.a)}</div></div></details></article>`;document.getElementById('count').textContent=data.length+' concepts';history.replaceState(null,'','?term='+encodeURIComponent(x.t));side(document.getElementById('search').value);document.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>go(decodeURIComponent(b.dataset.rel)))}function show(i){current=i;render();scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){current=Math.floor(Math.random()*data.length);render()}function go(t){let n=norm(t),i=data.findIndex(x=>norm(x.t)===n);if(i>=0)show(i)}document.getElementById('search').oninput=e=>side(e.target.value);fetch(ARCHIVE).then(r=>r.text()).then(t=>{data=canon(parse(t));let q=new URLSearchParams(location.search).get('term');if(q){let i=data.findIndex(x=>norm(x.t)===norm(q));if(i>=0)current=i}render()}).catch(()=>document.getElementById('view').innerHTML='<div class="lesson" style="padding:30px">Library unavailable. Please refresh.</div>');</script></body></html>
