<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Jargon Decoder · BodhiProtocol</title>
<meta name="description" content="Learn technical concepts visually, in plain English.">
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#111527;--muted:#697086;--line:#e6e9f1;--accent:#6f55e8;--soft:#f1efff;--wash:#faf9ff;--shadow:0 18px 55px rgba(29,36,65,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.shell{max-width:1280px;margin:auto;padding:0 22px}
.nav{height:66px;position:sticky;top:0;z-index:20;background:rgba(247,248,251,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{text-decoration:none;font-weight:850}.logo b{color:var(--accent)}.back{text-decoration:none;color:var(--muted);font-size:.84rem}
.layout{display:grid;grid-template-columns:285px 1fr;gap:20px;padding:22px 0 54px}.side{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 8px 28px rgba(29,36,65,.04)}
.sideHead{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 10px}.sideHead strong{font-size:.82rem}.count{font-size:.7rem;color:var(--muted)}.find{width:100%;border:1px solid var(--line);background:#fbfcfe;border-radius:12px;padding:10px 11px;outline:0;font:inherit;font-size:.8rem;margin-bottom:12px}.find:focus{border-color:#c9c0ff;box-shadow:0 0 0 3px var(--soft)}
.groupTitle{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#959caf;font-weight:850;padding:10px 7px 6px}.term{width:100%;border:1px solid transparent;background:transparent;border-radius:13px;padding:9px 10px;display:flex;gap:10px;align-items:center;text-align:left;color:var(--ink);cursor:pointer;margin:2px 0}.term:hover{background:#fafbfe}.term.active{background:var(--wash);border-color:#ddd7ff}.ico{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:.72rem;font-weight:900;flex:none}.term strong{font-size:.79rem}.term small{display:block;color:var(--muted);font-size:.65rem;margin-top:1px}
.main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px;color:var(--muted);font-size:.8rem}.tools{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;color:var(--muted);cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}.hero{padding:30px 32px 26px;background:radial-gradient(circle at 84% 18%,var(--soft),transparent 30%),linear-gradient(120deg,var(--wash),#fff 58%);border-bottom:1px solid var(--line)}.heroTop{display:flex;gap:15px;align-items:center}.big{width:58px;height:58px;border-radius:18px;background:#fff;border:1px solid #ddd7ff;display:grid;place-items:center;color:var(--accent);font-weight:900;box-shadow:0 8px 22px rgba(111,85,232,.10)}h1{margin:0;font-size:2rem;letter-spacing:-.045em}.full{display:inline-block;margin-top:4px;font-size:.7rem;color:var(--accent);background:var(--soft);border-radius:999px;padding:4px 8px;font-weight:800}.plain{font-size:1.08rem;font-weight:800;margin-top:20px}.analogy{font-size:.85rem;color:var(--muted);margin-top:6px}
.content{padding:24px}.canvas{min-height:260px;border:1px solid var(--line);border-radius:22px;padding:26px;background:linear-gradient(180deg,var(--wash),#fff);display:flex;flex-direction:column;justify-content:center}.label{text-align:center;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:900}.flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.node{min-width:105px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:15px;text-align:center;font-size:.8rem;font-weight:850;box-shadow:0 6px 16px rgba(29,36,65,.04)}.node.core{background:var(--soft);color:var(--accent);border-color:#d3cbff;transform:scale(1.04)}.arrow{font-weight:900;color:var(--accent)}.caption{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-top:14px}.panel{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.panel.tint{background:linear-gradient(135deg,var(--wash),#fff)}.ptitle{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:900}.quote{font-size:.9rem;font-weight:800;margin-top:7px}.small{font-size:.78rem;color:var(--muted);margin-top:5px}.qs{list-style:none;padding:0;margin:8px 0 0}.qs li{font-size:.77rem;color:var(--muted);margin:5px 0}.qs li:before{content:"✓";color:var(--accent);font-weight:900;margin-right:7px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{background:var(--soft);color:var(--accent);border-radius:999px;padding:5px 9px;font-size:.7rem;font-weight:800}.memory{background:#fffaf0;border-color:#efe4ca}.remember{max-width:540px;margin:16px auto 2px;text-align:center;padding:13px 18px;border-radius:18px;background:var(--wash);border:1px solid #e2dcff;font-weight:850}.remember span{display:block;font-size:.61rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
@media(max-width:920px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.groups{display:flex;overflow:auto;gap:8px}.groupBlock{min-width:230px}.grid{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:0 14px}.hero{padding:22px}.content{padding:16px}.heroTop h1{font-size:1.5rem}.big{width:50px;height:50px}.back{display:none}.canvas{padding:20px;min-height:220px}.node{min-width:78px}.toolbar{font-size:.73rem}}
</style></head><body>

<div class="shell"><div class="layout">
<aside class="side"><div class="sideHead"><strong>Explore concepts</strong><span class="count">20 concepts</span></div><input class="find" id="find" placeholder="Search concepts…"><div id="groups" class="groups"></div></aside>
<main class="main"><div class="toolbar"><span id="crumb">Visual learning</span><div class="tools"><button class="ghost" onclick="randomTerm()">↝ Random</button><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="next()">Next →</button></div></div><div id="view"></div></main>
</div></div>
<script>
const data=[
{n:'API',f:'Application Programming Interface',g:'APIs & Communication',i:'API',p:'A defined way for two systems to communicate.',a:'Think of it like a waiter carrying a request to the kitchen and bringing the response back.',nodes:['App','API','Service','Data'],core:1,cap:'A request goes in. A response comes back.',work:'“We’ll expose an API for customer details.”',meaning:'Another system can request customer information through an agreed contract.',qs:['What goes in?','What comes back?','What happens if it fails?'],dont:'API = interaction · Database = storage',tags:['REST','HTTP','JSON'],mem:'An API is the agreed doorway.',one:'One system asks; another responds.'},
{n:'Kafka',f:'Event streaming platform',g:'Data & Messaging',i:'K',p:'A platform for publishing and consuming streams of events in real time.',a:'Think of a shared news feed: producers publish; interested systems subscribe.',nodes:['Producer','Kafka','Consumer A','Consumer B'],core:1,cap:'Publish once. Multiple consumers can react independently.',work:'“We’ll publish order events to Kafka.”',meaning:'Other systems can react without the order system calling each one directly.',qs:['What event is published?','Who consumes it?','What if a consumer is down?'],dont:'Kafka = event stream · API = direct request',tags:['Events','Topics','Consumers'],mem:'Kafka is a highway for data in motion.',one:'Events move; systems react.'},
{n:'Authentication vs Authorization',f:'Identity vs permission',g:'Security & Access',i:'ID',p:'Authentication proves who you are. Authorization decides what you can do.',a:'Your office badge proves identity; access rules decide which doors it opens.',nodes:['Login','Identity ✓','Permission','Allow / Deny'],core:1,cap:'Identity first. Permission second.',work:'“Authenticated, but not authorized to approve.”',meaning:'The system knows the user, but their role does not permit the action.',qs:['How is identity verified?','Which roles exist?','What can each role do?'],dont:'Authentication = who · Authorization = what',tags:['MFA','RBAC','Roles'],mem:'First prove identity. Then check access.',one:'Who are you? What can you do?'},
{n:'CI/CD',f:'Continuous Integration / Delivery',g:'Build & Delivery',i:'∞',p:'Automation that checks code changes and moves safe changes toward deployment.',a:'A conveyor belt that inspects every change before it moves forward.',nodes:['Code','Build','Test','Deploy'],core:2,cap:'Changes progress only when required checks pass.',work:'“The CI/CD pipeline failed.”',meaning:'An automated build, test or delivery step did not complete successfully.',qs:['Which stage failed?','Which environment?','Was it deployed?'],dont:'Deployed ≠ necessarily released',tags:['Build','Test','Pipeline'],mem:'CI/CD is the automated path from code to deployable software.',one:'Build. Test. Move safely.'},
{n:'Load Balancer',f:'Traffic distribution',g:'Architecture & Web',i:'LB',p:'A traffic controller that spreads requests across multiple servers.',a:'A restaurant host sending arriving customers to available tables.',nodes:['Users','Load Balancer','Server A','Server B'],core:1,cap:'One entrance. Traffic is distributed across capacity.',work:'“Traffic goes through the load balancer.”',meaning:'Requests are routed to available servers instead of overwhelming one machine.',qs:['How is traffic routed?','What if a server fails?','Is health checked?'],dont:'Load balancer = distribute · Server = process',tags:['Traffic','Health Check','Scale'],mem:'One entrance, many servers.',one:'Spread the load; keep serving.'},
{n:'Cache',f:'Fast temporary storage',g:'Data & Messaging',i:'⚡',p:'A fast copy of frequently needed data kept closer to where it is used.',a:'Keeping your most-used items on your desk instead of walking to a cupboard every time.',nodes:['Request','Cache','Database'],core:1,cap:'Check the fast copy first; fetch the source only when needed.',work:'“That value is still in cache.”',meaning:'The application may be showing a stored copy rather than freshly reading the source.',qs:['How long is it cached?','How is it refreshed?','Can it become stale?'],dont:'Cache = fast copy · Database = source',tags:['TTL','Redis','Stale Data'],mem:'Cache trades freshness for speed.',one:'Closer data feels faster.'},
{n:'Database Index',f:'Faster lookup structure',g:'Data & Messaging',i:'IDX',p:'A structure that helps a database find rows without scanning everything.',a:'The index at the back of a book: find the topic, then jump to the page.',nodes:['Query','Index','Matching Rows'],core:1,cap:'Use a lookup path instead of checking every row.',work:'“We need an index on customer_id.”',meaning:'Frequent searches on that field may become much faster.',qs:['Which queries are slow?','Which columns are searched?','What is the write cost?'],dont:'Index = lookup aid · Table = actual records',tags:['SQL','Query','Performance'],mem:'An index helps the database know where to look.',one:'Find the address before the data.'},
{n:'OAuth',f:'Delegated access',g:'Security & Access',i:'OA',p:'A standard for letting one service access another on your behalf without sharing your password.',a:'Giving a valet a limited key instead of your master key.',nodes:['You','Consent','Token','App Access'],core:2,cap:'Permission is delegated through a limited token.',work:'“Allow the app to access your calendar.”',meaning:'You approve specific access without giving the app your account password.',qs:['What scope is requested?','How long does access last?','Can it be revoked?'],dont:'OAuth = delegated access · Password = credential',tags:['Token','Scope','Consent'],mem:'OAuth gives limited keys, not your master key.',one:'Grant access without sharing the password.'},
{n:'Webhook',f:'Event callback',g:'APIs & Communication',i:'WH',p:'A way for one system to automatically notify another when something happens.',a:'A doorbell: instead of repeatedly checking the door, you are told when someone arrives.',nodes:['Event','Webhook','Your App'],core:1,cap:'The event triggers a message to a registered destination.',work:'“Payment sends a webhook when it settles.”',meaning:'Your system can react when the provider reports the event.',qs:['Which events trigger it?','What payload arrives?','What if delivery fails?'],dont:'Webhook = pushed event · Polling = repeated checking',tags:['HTTP','Callback','Events'],mem:'A webhook says: something happened.',one:'Don’t keep asking; get notified.'},
{n:'Microservices',f:'Independent business services',g:'Architecture & Web',i:'μ',p:'An application split into services that each own a specific capability.',a:'A food court: separate counters, each responsible for one job.',nodes:['Customer','Order','Payment','Notification'],core:1,cap:'A customer journey can cross independently owned services.',work:'“Payment is handled by a separate microservice.”',meaning:'Payment logic lives in its own independently managed service.',qs:['Which service owns the rule?','What depends on it?','How do services communicate?'],dont:'Microservice = responsibility boundary · not just small code',tags:['API','Events','Domain'],mem:'Each service owns a clear capability.',one:'Split by responsibility, not size.'},
{n:'REST',f:'API design style',g:'APIs & Communication',i:'R',p:'A common way to design web APIs around resources and standard HTTP actions.',a:'A predictable counter where GET reads, POST creates and DELETE removes.',nodes:['Client','HTTP Verb','Resource','Response'],core:2,cap:'Standard actions make an API easier to understand.',work:'“Call GET /customers/42.”',meaning:'The client is requesting customer 42.',qs:['What resource?','Which HTTP method?','Which status codes?'],dont:'REST = design style · HTTP = transport',tags:['GET','POST','Status Code'],mem:'REST makes web interactions predictable.',one:'Resources + standard actions.'},
{n:'JSON',f:'Structured text format',g:'APIs & Communication',i:'{}',p:'A lightweight text format used to represent structured data.',a:'A labelled box: each value has a name so another system knows what it means.',nodes:['Field','Value','JSON Object'],core:2,cap:'Named fields make data portable between systems.',work:'“The API returns JSON.”',meaning:'The response arrives as structured key-value data.',qs:['Which fields are mandatory?','What are the types?','Can fields be null?'],dont:'JSON = format · API = interface',tags:['Payload','Schema','API'],mem:'JSON labels data so machines can exchange it.',one:'Keys describe values.'},
{n:'Message Queue',f:'Asynchronous messaging',g:'Data & Messaging',i:'MQ',p:'A buffer where messages wait until another system is ready to process them.',a:'A ticket queue: work waits until someone is available.',nodes:['Producer','Queue','Consumer'],core:1,cap:'Sender and receiver do not need to work at the same moment.',work:'“Put the request on the queue.”',meaning:'The sender can continue while another process handles it later.',qs:['What is queued?','How long can it wait?','What happens on failure?'],dont:'Queue = buffered work · API = immediate interaction',tags:['Async','Retry','Consumer'],mem:'A queue separates sending from processing.',one:'Send now; process when ready.'},
{n:'DNS',f:'Domain Name System',g:'Architecture & Web',i:'DNS',p:'The system that translates human-friendly domain names into network addresses.',a:'Your phone contacts: choose a name; the phone finds the number.',nodes:['Domain','DNS','IP Address','Server'],core:1,cap:'Names are resolved to addresses computers can route to.',work:'“DNS is not resolving.”',meaning:'The name cannot currently be translated to the server address.',qs:['Which record?','Has DNS changed?','Is it propagated?'],dont:'DNS = name lookup · Server = destination',tags:['Domain','IP','Record'],mem:'DNS is the internet’s contact list.',one:'Names become addresses.'},
{n:'CDN',f:'Content Delivery Network',g:'Architecture & Web',i:'CDN',p:'A network that serves content from locations closer to users.',a:'Instead of one warehouse, use local depots near customers.',nodes:['Origin','CDN Edge','Nearby User'],core:1,cap:'Popular content is delivered from a nearby edge location.',work:'“Static assets are served through a CDN.”',meaning:'Images and files can reach users without every request hitting the origin.',qs:['What is cached?','How is it invalidated?','What if the origin changes?'],dont:'CDN = distributed delivery · Origin = source',tags:['Edge','Cache','Latency'],mem:'Move content closer to the user.',one:'Distance costs time.'},
{n:'Docker',f:'Container platform',g:'Build & Delivery',i:'D',p:'A way to package an application with what it needs to run consistently.',a:'A shipping container: same package, different ships and ports.',nodes:['App','Docker Image','Container','Host'],core:1,cap:'Package once; run the same bundle across environments.',work:'“It works in the Docker container.”',meaning:'The application and its dependencies are packaged together.',qs:['Which image version?','What configuration differs?','Where is it running?'],dont:'Image = package · Container = running instance',tags:['Image','Container','Runtime'],mem:'Docker packages the runtime environment.',one:'Package once; run consistently.'},
{n:'Kubernetes',f:'Container orchestration',g:'Build & Delivery',i:'K8s',p:'A system that manages many containers: placement, scaling, recovery and rollout.',a:'An operations manager deciding where workers run and replacing them when they fail.',nodes:['Desired State','Kubernetes','Containers','Healthy Service'],core:1,cap:'Kubernetes keeps the running system close to the desired state.',work:'“Kubernetes restarted the pod.”',meaning:'The platform detected a problem and replaced a container workload.',qs:['What is the desired state?','What failed?','How many replicas?'],dont:'Docker = package/run · Kubernetes = manage many',tags:['Pod','Replica','Cluster'],mem:'Kubernetes keeps containers running as intended.',one:'Declare the state; the platform maintains it.'},
{n:'Git',f:'Version control',g:'Build & Delivery',i:'Git',p:'A system for tracking changes to files and coordinating work across versions.',a:'A detailed save history where every meaningful change has a snapshot.',nodes:['Edit','Commit','Branch','Merge'],core:1,cap:'Changes become traceable snapshots that can be compared or combined.',work:'“Which commit introduced this?”',meaning:'The team is tracing behaviour back to a specific code change.',qs:['Which branch?','Which commit?','What changed?'],dont:'Git = version control · GitHub = hosting/collaboration',tags:['Commit','Branch','Merge'],mem:'Git remembers how the code changed.',one:'Every change can have a history.'},
{n:'SQL',f:'Structured Query Language',g:'Data & Messaging',i:'SQL',p:'A language used to ask relational databases for data and change it.',a:'Giving a precise request to a very organised filing room.',nodes:['Question','SQL Query','Database','Result'],core:1,cap:'A query describes the data you want; the database returns matching rows.',work:'“Run the SQL against production data.”',meaning:'Use a database query to inspect the actual stored records.',qs:['Which tables?','Which filters?','Is the query read-only?'],dont:'SQL = language · Database = system',tags:['SELECT','JOIN','Table'],mem:'SQL is how you ask a relational database questions.',one:'Describe the result you want.'},
{n:'Encryption',f:'Protecting readable data',g:'Security & Access',i:'🔒',p:'A way to transform readable data into a form that requires a key to understand.',a:'Locking a message in a box that only the right key can open.',nodes:['Plain Data','Encrypt + Key','Ciphertext','Decrypt + Key'],core:1,cap:'Without the right key, captured data should remain unreadable.',work:'“The field is encrypted at rest.”',meaning:'Stored data is protected so raw storage does not expose readable values.',qs:['In transit or at rest?','Who manages keys?','Where is decryption allowed?'],dont:'Encryption = reversible with key · Hashing = one-way',tags:['Key','TLS','Cipher'],mem:'Encryption protects meaning, not just access.',one:'Readable data becomes unreadable without the key.'}
];
const groups=['APIs & Communication','Data & Messaging','Architecture & Web','Security & Access','Build & Delivery'];
let current=0, query=''; const $=id=>document.getElementById(id);
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function renderSide(){const q=query.toLowerCase();let html='';groups.forEach(g=>{const arr=data.map((x,i)=>({x,i})).filter(o=>o.x.g===g&&(!q||(o.x.n+' '+o.x.f).toLowerCase().includes(q)));if(!arr.length)return;html+=`<div class="groupBlock"><div class="groupTitle">${esc(g)}</div>${arr.map(o=>`<button class="term ${o.i===current?'active':''}" onclick="show(${o.i})"><span class="ico">${esc(o.x.i)}</span><span><strong>${esc(o.x.n)}</strong><small>${esc(o.x.f)}</small></span></button>`).join('')}</div>`});$('groups').innerHTML=html||'<div class="small" style="padding:10px">No matching concepts.</div>'}
function render(){const t=data[current];renderSide();$('crumb').textContent=`${t.g} · ${current+1} of ${data.length}`;$('view').innerHTML=`<article class="card"><section class="hero"><div class="heroTop"><div class="big">${esc(t.i)}</div><div><h1>${esc(t.n)}</h1><span class="full">${esc(t.f)}</span></div></div><div class="plain">${esc(t.p)}</div><div class="analogy">💡 ${esc(t.a)}</div></section><div class="content"><section class="canvas"><div class="label">See the idea</div><div class="flow">${t.nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node ${i===t.core?'core':''}">${esc(n)}</div>`).join('')}</div><div class="caption">${esc(t.cap)}</div></section><div class="grid"><section class="panel tint"><div class="ptitle">At work</div><div class="quote">${esc(t.work)}</div><div class="small">${esc(t.meaning)}</div></section><section class="panel"><div class="ptitle">BA lens</div><ul class="qs">${t.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></section><section class="panel"><div class="ptitle">Don’t confuse</div><div class="small" style="margin-top:8px;color:var(--ink)">${esc(t.dont)}</div></section></div><div class="bottom"><section class="panel"><div class="ptitle">Related concepts</div><div class="tags">${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></section><section class="panel memory"><div class="ptitle">Memory hook</div><div class="small" style="margin-top:8px;color:var(--ink);font-weight:700">★ ${esc(t.mem)}</div></section></div><div class="remember"><span>One thing to remember</span>${esc(t.one)}</div></div></article>`;history.replaceState(null,'',`?term=${encodeURIComponent(t.n)}`)}
function show(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){let n=current;while(n===current)n=Math.floor(Math.random()*data.length);current=n;render()}
$('find').addEventListener('input',e=>{query=e.target.value;renderSide()});const wanted=new URLSearchParams(location.search).get('term');if(wanted){const i=data.findIndex(x=>x.n.toLowerCase()===wanted.toLowerCase());if(i>=0)current=i}render();
</script></body></html>
