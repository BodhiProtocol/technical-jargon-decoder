<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical Jargon Decoder · Focus Pilot · BodhiProtocol</title><style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#171a2a;--muted:#697087;--faint:#9ba1b4;--line:#e7e9f2;--accent:#6f55e8;--soft:#f3f0ff;--soft2:#fbfaff;--shadow:0 12px 38px rgba(36,31,82,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:1120px;margin:auto;padding:0 22px}.nav{background:rgba(247,248,252,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}.navin{height:62px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;text-decoration:none;color:var(--ink)}.logo b{color:var(--accent)}.back{font-size:.84rem;color:var(--muted);text-decoration:none}.hero{text-align:center;padding:42px 0 20px}.hero h1{font-size:clamp(2rem,5vw,3.25rem);letter-spacing:-.045em;line-height:1.06;margin:10px 0}.hero p{color:var(--muted);margin:0 auto;max-width:620px}.eyebrow,.label,.diagram-title{font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--accent)}.picker{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0 26px}.pick{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;color:var(--muted);font-weight:650;cursor:pointer}.pick.active{background:var(--accent);border-color:var(--accent);color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow);margin-bottom:64px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.navbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:var(--muted);cursor:pointer}.head{display:flex;align-items:center;gap:14px}.ico{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:850}.head h2{font-size:1.55rem;margin:0}.full{font-size:.84rem;color:var(--muted)}.intro{margin-top:22px}.plain{font-size:1.12rem;font-weight:700;margin-top:6px}.analogy{color:var(--muted);font-size:.88rem;margin-top:5px;font-style:italic}.diagram{margin:22px 0;padding:24px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(180deg,var(--soft2),#fff)}.diagram-title{text-align:center;color:var(--faint);margin-bottom:18px}.flow{display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap}.node{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 15px;min-width:100px;text-align:center;font-size:.8rem;font-weight:750;box-shadow:0 3px 12px rgba(30,25,80,.04)}.arrow{color:var(--accent);font-weight:900}.caption{text-align:center;color:var(--muted);font-size:.82rem;margin-top:15px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-top:1px solid var(--line);padding-top:20px}.quote{font-weight:750;margin-top:7px}.translation,.lens p{font-size:.84rem;color:var(--muted);margin:5px 0 0}.lens{background:var(--soft2);border-radius:15px;padding:15px}.footerline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:19px;padding-top:17px}.dont{font-size:.8rem;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{border:0;background:var(--soft);color:#5940c7;border-radius:999px;padding:5px 10px;font-size:.72rem;font-weight:700}.remember{margin-top:17px;background:#faf9ff;border:1px solid #e7e2ff;border-radius:14px;padding:12px 14px;color:var(--muted);font-size:.82rem}.remember strong{color:var(--accent)}.foot{text-align:center;color:var(--faint);font-size:.75rem;padding:25px;border-top:1px solid var(--line);background:#fff}@media(max-width:700px){.wrap{padding:0 15px}.card{padding:21px}.lower{grid-template-columns:1fr}.back{display:none}.topbar{align-items:flex-start}.node{min-width:78px}.hero{padding-top:30px}}
</style></head><body><nav class="nav"><div class="wrap navin"><a class="logo" href="https://bodhiprotocol.com/">Bodhi<b>Protocol</b></a><a class="back" href="./">← Technical Jargon Decoder</a></div></nav><header class="hero wrap"><div class="eyebrow">Focused learning pilot</div><h1>One concept. One clear mental model.</h1><p>Choose a term. It becomes the single centered learning experience.</p></header><div class="wrap"><div class="picker" id="picker"></div><main id="view"></main></div><footer class="foot">BodhiProtocol · Technical Jargon Decoder · Focus Mode Pilot</footer><script>
const terms=[
{n:'API',f:'Application Programming Interface',i:'API',p:'A defined way for two systems to communicate.',a:'Think of it like a waiter carrying a request to the kitchen and bringing the response back.',nodes:['Mobile App','API','Service','Data'],cap:'A request goes in. A response comes back.',q:'“We’ll expose an API for customer details.”',tr:'Meaning: another system can request customer information through an agreed contract.',lens:'What goes in? What comes back? What happens if it fails?',dont:'API = how systems interact · Database = where data lives',tags:['REST','HTTP','JSON'],mem:'An API is the agreed doorway. One system asks; another responds.'},
{n:'Kafka',f:'Event streaming platform',i:'K',p:'A system for publishing events so other systems can react to them.',a:'Think of it like a shared noticeboard: one team posts; interested teams pick it up.',nodes:['Producer','Kafka Topic','Consumers'],cap:'One system publishes. Multiple systems can listen independently.',q:'“Publish the order-created event to Kafka.”',tr:'Meaning: emit an event so downstream systems can react without a direct call.',lens:'What creates the event? Who consumes it? What happens on retry or duplication?',dont:'Kafka = event stream · API = direct request/response',tags:['Producer','Topic','Consumer'],mem:'Kafka helps systems react to events without every system calling every other system directly.'},
{n:'Microservices',f:'Independent services by business capability',i:'μ',p:'An application split into smaller services, each responsible for a specific capability.',a:'Think of it like a food court: separate counters, each owning one job.',nodes:['Customer','Order','Payment','Notification'],cap:'One customer journey can cross several independently owned services.',q:'“Payment is handled by a separate microservice.”',tr:'Meaning: payment logic lives in its own independently managed service.',lens:'Which service owns the rule? What depends on it? What if it is unavailable?',dont:'Microservice = responsibility boundary · not simply “small code”',tags:['Gateway','Service','Events'],mem:'The useful question is not “how small is it?” It is “what capability does this service own?”'},
{n:'Authentication vs Authorization',f:'Identity vs permission',i:'ID',p:'Authentication proves who you are. Authorization decides what you are allowed to do.',a:'Think of it as showing your ID at the door, then checking which rooms your pass opens.',nodes:['Login','Identity ✓','Role / Permission','Allow ✓ or Deny ✕'],cap:'Identity first. Permission second.',q:'“The user is authenticated but not authorized to approve payments.”',tr:'Meaning: we know who they are, but their role does not permit that action.',lens:'How is identity verified? Which roles exist? What can each role see and do?',dont:'Authentication = identity · Authorization = permission',tags:['MFA','Role','RBAC'],mem:'Authentication asks “Who are you?” Authorization asks “What can you do?”'},
{n:'CI/CD',f:'Continuous Integration / Continuous Delivery',i:'CI',p:'Automation that checks code changes and moves them safely toward deployment.',a:'Think of it like a conveyor belt that inspects every change before it moves forward.',nodes:['Code','Build','Test','Deploy'],cap:'Code moves forward only when the required checks pass.',q:'“The CI/CD pipeline failed.”',tr:'Meaning: an automated build, test, or delivery step did not complete successfully.',lens:'Which stage failed? Which environment? Was the change deployed? Was it released?',dont:'Deployed ≠ necessarily released to users',tags:['Build','Test','Deploy'],mem:'CI/CD is the automated path from code change to deployable software.'}
];let current=0;const picker=document.getElementById('picker'),view=document.getElementById('view');function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function render(){picker.innerHTML=terms.map((t,i)=>`<button class="pick ${i===current?'active':''}" onclick="showTerm(${i})">${esc(t.n)}</button>`).join('');const t=terms[current];view.innerHTML=`<section class="card"><div class="topbar"><button class="navbtn" onclick="prev()">← Previous</button><button class="navbtn" onclick="next()">Next →</button></div><div class="head"><div class="ico">${esc(t.i)}</div><div><h2>${esc(t.n)}</h2><div class="full">${esc(t.f)}</div></div></div><div class="intro"><div class="label">Plain English</div><div class="plain">${esc(t.p)}</div><div class="analogy">${esc(t.a)}</div></div><div class="diagram"><div class="diagram-title">See how it works</div><div class="flow">${t.nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node">${esc(n)}</div>`).join('')}</div><div class="caption">${esc(t.cap)}</div></div><div class="lower"><div><div class="label">At work</div><div class="quote">${esc(t.q)}</div><div class="translation">${esc(t.tr)}</div></div><div class="lens"><div class="label">BA Lens</div><p>${esc(t.lens)}</p></div></div><div class="footerline"><div class="dont"><strong>Don’t confuse:</strong> ${esc(t.dont)}</div><div class="tags">${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="remember"><strong>Remember:</strong> ${esc(t.mem)}</div></section>`;history.replaceState(null,'',`?term=${encodeURIComponent(t.n)}`)}function showTerm(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function prev(){current=(current-1+terms.length)%terms.length;render()}function next(){current=(current+1)%terms.length;render()}const wanted=new URLSearchParams(location.search).get('term');if(wanted){const i=terms.findIndex(t=>t.n.toLowerCase()===wanted.toLowerCase());if(i>=0)current=i}render();
</script></body></html>
