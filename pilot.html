<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jargon Decoder · Premium Pilot · BodhiProtocol</title><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#10172b;--muted:#667087;--line:#e7eaf1;--accent:#6f55e8;--soft:#f3f0ff;--wash:#faf9ff;--shadow:0 18px 55px rgba(30,38,70,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.shell{max-width:1280px;margin:auto;padding:0 22px}.nav{height:64px;background:rgba(246,248,251,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:850;text-decoration:none;color:var(--ink);font-size:1.05rem}.logo b{color:var(--accent)}.back{color:var(--muted);font-size:.84rem;text-decoration:none}.layout{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:24px 0 55px}.side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 30px rgba(30,38,70,.04);align-self:start;position:sticky;top:88px}.side-title{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);padding:5px 5px 12px}.term{width:100%;border:1px solid transparent;background:transparent;border-radius:16px;padding:13px;display:flex;gap:11px;align-items:center;text-align:left;cursor:pointer;margin-bottom:6px;color:var(--ink)}.term:hover{background:#fafbfe}.term.active{background:var(--wash);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 9%,transparent)}.ticon{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:850;flex:none}.term strong{font-size:.88rem;display:block}.term span{font-size:.7rem;color:var(--muted);display:block;margin-top:2px}.main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:2px 3px 12px;color:var(--muted);font-size:.82rem}.tools{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;color:var(--muted);cursor:pointer}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);animation:enter .22s ease both}@keyframes enter{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}.hero{padding:28px 30px 25px;background:radial-gradient(circle at 82% 30%,var(--soft),transparent 28%),linear-gradient(120deg,var(--wash),#fff 52%);border-bottom:1px solid var(--line)}.head{display:flex;gap:15px;align-items:center}.bigicon{width:62px;height:62px;border-radius:18px;background:#fff;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;color:var(--accent);font-weight:900}.head h1{margin:0;font-size:2rem;letter-spacing:-.04em}.pill{display:inline-block;margin-top:5px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.72rem;font-weight:750;padding:4px 9px}.intro{margin-top:22px}.label{font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;font-weight:850;color:var(--accent)}.plain{font-size:1.1rem;font-weight:750;margin-top:6px}.analogy{font-size:.86rem;color:var(--muted);font-style:italic;margin-top:6px}.content{padding:24px}.diagram{border:1px solid var(--line);border-radius:20px;padding:23px;background:linear-gradient(180deg,var(--wash),#fff);box-shadow:inset 0 1px 0 #fff}.diagram-title{text-align:center}.flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.node{min-width:115px;padding:14px 13px;background:#fff;border:1px solid var(--line);border-radius:15px;text-align:center;font-size:.8rem;font-weight:800;box-shadow:0 6px 18px rgba(30,38,70,.05)}.node.core{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--wash);color:var(--accent);transform:scale(1.06)}.arrow{font-size:1.1rem;color:var(--accent);font-weight:900}.caption{text-align:center;color:var(--muted);font-size:.8rem;margin-top:17px}.three{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px;margin-top:16px}.panel{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fff}.panel.work{background:linear-gradient(135deg,var(--wash),#fff)}.quote{font-weight:800;margin-top:7px;font-size:.91rem}.small{font-size:.79rem;color:var(--muted);margin-top:5px}.questions{margin:8px 0 0;padding:0;list-style:none}.questions li{font-size:.78rem;color:var(--muted);margin:5px 0}.questions li:before{content:'✓';color:var(--accent);font-weight:900;margin-right:7px}.compare{font-size:.8rem;color:var(--muted);margin-top:7px}.compare strong{color:var(--ink)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:999px;font-size:.71rem;font-weight:750}.memory{background:linear-gradient(135deg,#fff9eb,#fff);border-color:#f0e5c9}.memory .small{font-size:.84rem;color:var(--ink);font-weight:650}.one{margin:16px auto 2px;max-width:520px;text-align:center;padding:13px 20px;border-radius:999px;background:var(--wash);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));font-weight:850;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 8%,transparent)}.one span{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:7px}.side-title{display:none}.term{min-width:190px;margin:0}.three{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:0 14px}.layout{padding-top:14px}.hero{padding:22px}.content{padding:17px}.head h1{font-size:1.55rem}.bigicon{width:52px;height:52px}.back{display:none}.node{min-width:82px}.toolbar{font-size:.75rem}.one{border-radius:18px}}</style></head><body><nav class="nav"><div class="shell"><a class="logo" href="https://bodhiprotocol.com/">Bodhi<b>Protocol</b></a><a class="back" href="./">← Back to Jargon Decoder</a></div></nav><div class="shell"><div class="layout"><aside class="side"><div class="side-title">Visual learning pilot</div><div id="terms"></div></aside><main class="main"><div class="toolbar"><span>Focused learning · 5 concepts</span><div class="tools"><button class="ghost" onclick="randomTerm()">↝ Random</button><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="next()">Next →</button></div></div><div id="view"></div></main></div></div><script>const data=[{n:'API',f:'Application Programming Interface',icon:'API',color:'#6f55e8',soft:'#f3f0ff',wash:'#faf9ff',p:'A defined way for two systems to communicate.',a:'Think of it like a waiter carrying a request to the kitchen and bringing the response back.',nodes:['Mobile App','API','Service','Data'],core:1,cap:'A request goes in. A response comes back.',work:'“We’ll expose an API for customer details.”',meaning:'Another system can request customer information through an agreed contract.',qs:['What goes in?','What comes back?','What happens if it fails?'],dont:'API = how systems interact · Database = where data lives',tags:['REST','HTTP','JSON'],mem:'An API is the agreed doorway.',one:'One system asks; another responds.'},{n:'Kafka',f:'Data streaming platform',icon:'K',color:'#159447',soft:'#edf9f0',wash:'#f8fcf8',p:'A platform that lets systems publish and consume data streams in real time.',a:'Think of it like a post office for data — messages go in, and the right systems pick them up.',nodes:['Producers','Kafka','Consumers'],core:1,cap:'Messages are stored, distributed and delivered reliably.',work:'“We’ll use Kafka to stream order events.”',meaning:'When an order happens, it is published so many systems can consume it in real time.',qs:['What events will be published?','Who will consume them?','What is the expected volume?','What if a consumer is down?'],dont:'Kafka = streaming data · Database = data stored for lookup',tags:['Message Queue','Event Driven','Streaming','Pub/Sub'],mem:'Kafka is the highway for data in motion.',one:'Events move; systems react.'},{n:'Microservices',f:'Independent services by capability',icon:'μ',color:'#2672e5',soft:'#edf5ff',wash:'#f8fbff',p:'An application split into smaller services, each responsible for a specific business capability.',a:'Think of it like a food court: separate counters, each owning one job.',nodes:['Customer','Order','Payment','Notification'],core:1,cap:'One customer journey can cross several independently owned services.',work:'“Payment is handled by a separate microservice.”',meaning:'Payment logic lives in its own independently managed service.',qs:['Which service owns the rule?','What depends on it?','How do services communicate?','What if one is unavailable?'],dont:'Microservice = responsibility boundary · not simply small code',tags:['API Gateway','Events','Service','Domain'],mem:'Each service owns a clear capability.',one:'Split by responsibility, not just size.'},{n:'Authentication vs Authorization',f:'Identity vs permission',icon:'ID',color:'#1679c4',soft:'#eef7ff',wash:'#f8fbff',p:'Authentication proves who you are. Authorization decides what you are allowed to do.',a:'Think of it as showing ID at the door, then checking which rooms your pass opens.',nodes:['Login','Identity ✓','Permission','Allow / Deny'],core:1,cap:'Identity first. Permission second.',work:'“The user is authenticated but not authorized to approve payments.”',meaning:'We know who the user is, but their role does not permit that action.',qs:['How is identity verified?','Which roles exist?','What can each role do?','What happens when access is denied?'],dont:'Authentication = identity · Authorization = permission',tags:['MFA','RBAC','Role','Permission'],mem:'First prove identity. Then check access.',one:'Who are you? What can you do?'},{n:'CI/CD',f:'Continuous Integration / Continuous Delivery',icon:'∞',color:'#df7a13',soft:'#fff4e9',wash:'#fffbf7',p:'Automation that checks code changes and moves them safely toward deployment.',a:'Think of it like a conveyor belt that inspects every change before it moves forward.',nodes:['Code','Build','Test','Deploy'],core:2,cap:'Code moves forward only when the required checks pass.',work:'“The CI/CD pipeline failed.”',meaning:'An automated build, test, or delivery step did not complete successfully.',qs:['Which stage failed?','Which environment?','Was it deployed?','Was it actually released?'],dont:'Deployed ≠ necessarily released to users',tags:['Build','Test','Deploy','Pipeline'],mem:'CI/CD is the automated path from code to deployable software.',one:'Build. Test. Move safely.'}];let current=0;const terms=document.getElementById('terms'),view=document.getElementById('view');function e(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function render(){const t=data[current];document.documentElement.style.setProperty('--accent',t.color);document.documentElement.style.setProperty('--soft',t.soft);document.documentElement.style.setProperty('--wash',t.wash);terms.innerHTML=data.map((x,i)=>`<button class="term ${i===current?'active':''}" onclick="show(${i})"><span class="ticon">${e(x.icon)}</span><span><strong>${e(x.n)}</strong><span>${e(x.f)}</span></span></button>`).join('');view.innerHTML=`<article class="card"><section class="hero"><div class="head"><div class="bigicon">${e(t.icon)}</div><div><h1>${e(t.n)}</h1><span class="pill">${e(t.f)}</span></div></div><div class="intro"><div class="label">1 · Plain English</div><div class="plain">${e(t.p)}</div><div class="analogy">💡 ${e(t.a)}</div></div></section><div class="content"><section class="diagram"><div class="label diagram-title">2 · See how it works</div><div class="flow">${t.nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node ${i===t.core?'core':''}">${e(n)}</div>`).join('')}</div><div class="caption">${e(t.cap)}</div></section><div class="three"><section class="panel work"><div class="label">3 · At work</div><div class="quote">${e(t.work)}</div><div class="small">${e(t.meaning)}</div></section><section class="panel"><div class="label">4 · BA Lens</div><ul class="questions">${t.qs.map(q=>`<li>${e(q)}</li>`).join('')}</ul></section><section class="panel"><div class="label">5 · Don’t confuse</div><div class="compare"><strong>${e(t.dont.split(' · ')[0])}</strong>${t.dont.includes(' · ')?'<br>· '+e(t.dont.split(' · ').slice(1).join(' · ')):''}</div></section></div><div class="bottom"><section class="panel"><div class="label">Related concepts</div><div class="tags">${t.tags.map(x=>`<span class="tag">${e(x)}</span>`).join('')}</div></section><section class="panel memory"><div class="label">Memory hook</div><div class="small">★ ${e(t.mem)}</div></section></div><div class="one"><span>One thing to remember</span>${e(t.one)}</div></div></article>`;history.replaceState(null,'',`?term=${encodeURIComponent(t.n)}`)}function show(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){let n=current;while(n===current)n=Math.floor(Math.random()*data.length);current=n;render()}const wanted=new URLSearchParams(location.search).get('term');if(wanted){const i=data.findIndex(x=>x.n.toLowerCase()===wanted.toLowerCase());if(i>=0)current=i}render();</script></body></html>
