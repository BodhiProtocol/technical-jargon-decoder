<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Jargon Decoder · BodhiProtocol</title><meta name="description" content="Technical concepts explained visually, in plain English."><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#10172b;--muted:#667087;--line:#e7eaf1;--accent:#6f55e8;--soft:#f3f0ff;--wash:#faf9ff;--green:#11845b;--greenSoft:#eefaf5;--red:#c94b4b;--shadow:0 18px 55px rgba(30,38,70,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.shell{max-width:1440px;margin:auto;padding:0 24px}.nav{height:64px;border-bottom:1px solid var(--line);background:rgba(246,248,251,.94);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}.nav .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:850;text-decoration:none;color:var(--ink)}.logo b,.label{color:var(--accent)}.back{color:var(--muted);font-size:.86rem;text-decoration:none}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding:24px 0 55px}.side,.card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.side{border-radius:22px;padding:12px;align-self:start;position:sticky;top:88px;max-height:calc(100vh - 110px);overflow:auto}.side-title,.group-title,.label{font-size:.69rem;letter-spacing:.1em;text-transform:uppercase;font-weight:850}.side-title{color:var(--muted);padding:3px 5px 10px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;font:inherit;font-size:.84rem;outline:0}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}.group-title{color:#999fb1;padding:14px 7px 5px}.term{width:100%;border:1px solid transparent;background:transparent;border-radius:11px;padding:8px;text-align:left;cursor:pointer;margin-bottom:1px;color:var(--ink)}.term:hover{background:#fafbfe}.term.active{background:var(--wash);border-color:#ddd7ff}.term strong{font-size:.8rem}.term small{display:block;color:var(--muted);font-size:.64rem;margin-top:1px}.main{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:2px 3px 12px;color:var(--muted);font-size:.84rem}.tools{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;cursor:pointer;color:var(--muted)}.card{border-radius:28px;overflow:hidden}.hero{padding:34px 38px;background:radial-gradient(circle at 84% 25%,var(--soft),transparent 30%),linear-gradient(120deg,var(--wash),#fff 52%);border-bottom:1px solid var(--line)}.hero h1{font-size:2.35rem;margin:0;letter-spacing:-.045em}.pill{display:inline-block;margin-top:7px;background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:999px;font-size:.76rem}.plain{font-size:1.2rem;font-weight:780;margin-top:22px;max-width:960px}.analogy{color:var(--muted);font-size:.94rem;margin-top:8px;font-style:italic}.content{padding:28px}.diagram{border:1px solid var(--line);border-radius:22px;padding:30px;background:linear-gradient(180deg,var(--wash),#fff);min-height:330px}.label{text-align:center}.viz{min-height:230px;display:flex;align-items:center;justify-content:center;margin-top:16px}.flow{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}.node{min-width:135px;padding:18px 15px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center;font-size:.9rem;font-weight:800;box-shadow:0 6px 18px rgba(30,38,70,.05)}.core{background:var(--soft);border-color:#d2caff;color:var(--accent)}.arrow{color:var(--accent);font-weight:900;font-size:1.1rem}.stack{display:grid;gap:9px;min-width:360px}.layer{padding:13px 20px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:center;font-size:.88rem}.layer.core{background:var(--soft)}.tables{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}.table{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;min-width:180px}.row{padding:9px 12px;border-bottom:1px solid var(--line);font-size:.82rem}.row:last-child{border:0}.row b{color:var(--accent)}.star{display:grid;grid-template-columns:repeat(3,110px);grid-template-rows:repeat(3,68px);gap:10px;place-items:center}.star .node{min-width:104px;padding:11px}.star .center{grid-column:2;grid-row:2}.cycle{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.badge{padding:10px 15px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.84rem;font-weight:800}.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-top:18px}.panel{border:1px solid var(--line);border-radius:18px;padding:19px;background:#fff}.panel.work{background:var(--wash)}.quote{font-weight:800;margin-top:9px;font-size:.95rem;line-height:1.45}.small,.qs{font-size:.84rem;color:var(--muted)}.qs{padding-left:19px;line-height:1.7}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.tag{border:0;background:var(--soft);color:var(--accent);padding:6px 10px;border-radius:999px;font-size:.76rem;margin:7px 4px 0 0;cursor:pointer}.memory{background:#fffaf0}.api-map{width:min(900px,100%);display:grid;grid-template-columns:1fr 155px 1fr;align-items:center;gap:24px}.api-side{text-align:center}.api-device,.api-system{height:118px;border:1px solid var(--line);border-radius:18px;background:#fff;display:grid;place-items:center;font-weight:850;font-size:.92rem;box-shadow:0 8px 22px rgba(30,38,70,.05)}.api-center{height:132px;border:1px solid #cfc6ff;border-radius:66px;background:var(--soft);color:var(--accent);display:grid;place-items:center;text-align:center;font-size:1.6rem;font-weight:900}.api-center small{display:block;font-size:.68rem;color:var(--muted);font-weight:700}.api-lines{grid-column:1/-1;display:grid;grid-template-columns:1fr 155px 1fr;gap:24px;margin-top:-8px;color:var(--muted);font-size:.78rem}.api-lines div{text-align:center}.api-lines b{color:var(--accent)}.kafka-map{width:min(920px,100%);display:grid;grid-template-columns:180px 1fr 210px;gap:30px;align-items:center}.k-col{display:grid;gap:10px}.k-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;text-align:center;font-size:.82rem;font-weight:800}.k-topic{border:1px solid #cfc6ff;background:var(--soft);border-radius:22px;padding:25px;text-align:center;color:var(--accent);font-size:1rem;font-weight:900}.events{display:flex;justify-content:center;gap:7px;margin-top:13px}.event{width:34px;height:27px;border-radius:7px;background:#fff;border:1px solid #d7d0ff;font-size:.65rem;display:grid;place-items:center}.k-arrow{text-align:center;color:var(--accent);font-weight:900;margin:6px 0;font-size:.84rem}.pipeline{display:grid;grid-template-columns:repeat(9,auto);align-items:center;justify-content:center;gap:12px;width:100%}.pstep{width:112px;height:94px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;place-items:center;text-align:center;font-size:.82rem;font-weight:850}.pstep strong{display:block;font-size:1.45rem}.pstep.final{background:var(--greenSoft);border-color:#ccebdd;color:var(--green)}.parrow{color:var(--accent);font-weight:900}.auth-map{display:grid;grid-template-columns:1fr 54px 1fr;gap:22px;align-items:stretch;width:min(900px,100%)}.auth-box{border:1px solid #d6d0ff;border-radius:19px;background:#faf9ff;padding:22px}.auth-box.authorize{border-color:#cde9dc;background:var(--greenSoft)}.auth-head{font-size:.9rem;font-weight:900;color:var(--accent);margin-bottom:14px}.authorize .auth-head{color:var(--green)}.auth-step{padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:11px;font-size:.8rem;margin:9px 0}.auth-mid{display:grid;place-items:center;color:var(--accent);font-size:1.6rem;font-weight:900}.boundary{width:min(900px,100%)}.range-labels{display:grid;grid-template-columns:1fr 2fr 1fr;text-align:center;font-size:.78rem;font-weight:850;margin-bottom:14px}.range-labels .bad{color:var(--red)}.range-labels .good{color:var(--green)}.numline{height:7px;background:linear-gradient(90deg,#f5caca 0 20%,#cbead9 20% 80%,#f5caca 80%);border-radius:999px;position:relative;margin:42px}.mark{position:absolute;top:-29px;transform:translateX(-50%);text-align:center;font-size:.76rem;font-weight:850}.mark:after{content:'';display:block;width:2px;height:37px;background:var(--ink);margin:6px auto 0}.mark.bad{color:var(--red)}.mark.good{color:var(--green)}.m17{left:7%}.m18{left:20%}.m19{left:32%}.m59{left:68%}.m60{left:80%}.m61{left:93%}.test-note{text-align:center;color:var(--muted);font-size:.82rem;margin-top:48px}@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:static;max-height:330px}.three,.bottom{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(5,auto)}}@media(max-width:680px){.shell{padding:0 14px}.hero,.content{padding:21px}.hero h1{font-size:1.7rem}.plain{font-size:1.05rem}.back{display:none}.diagram{padding:20px;min-height:260px}.viz{min-height:180px}.node{min-width:88px;padding:12px;font-size:.76rem}.star{grid-template-columns:repeat(3,78px)}.tables{gap:10px}.api-map{grid-template-columns:1fr 90px 1fr;gap:8px}.api-center{height:92px;font-size:1rem}.api-device,.api-system{height:90px;font-size:.72rem}.api-lines{display:none}.kafka-map{grid-template-columns:1fr;gap:10px}.auth-map{grid-template-columns:1fr}.auth-mid{transform:rotate(90deg)}.pipeline{grid-template-columns:1fr 22px 1fr 22px 1fr;gap:5px}.pstep{width:78px;height:78px}.range-labels{font-size:.6rem}.numline{margin-left:20px;margin-right:20px}}</style></head><body><nav class="nav"><div class="shell"><a class="logo" href="./">Bodhi<b>Protocol</b></a><a class="back" href="./">← Jargon Decoder home</a></div></nav><div class="shell"><div class="layout"><aside class="side"><div class="side-title">Explore concepts</div><input class="search" id="search" placeholder="Search all concepts…"><div id="terms">Loading…</div></aside><main class="main"><div class="toolbar"><span>Visual learning · <b id="count">…</b></span><div class="tools"><button class="ghost" onclick="randomTerm()">↝ Random</button><button class="ghost" onclick="prev()">←</button><button class="ghost" onclick="next()">Next →</button></div></div><div id="view">Loading library…</div></main></div></div><script>const ARCHIVE='https://raw.githubusercontent.com/BodhiProtocol/technical-jargon-decoder/8853a32fe2c8bba4ad92dbfd1889e592ec8b885f/index.html';const CATS=['Software & Development','Cloud & Infrastructure','Data & Databases','Testing & QA','Architecture','Agile & Delivery'];const EXTRA=[['Kafka','Apache Kafka',2,'A distributed event-streaming platform that lets systems publish, store and consume events at scale.','Like a durable shared news feed.','OrderCreated can feed payments, analytics and notifications.',['Message Queue','Microservices','API']],['OAuth','Open Authorization',0,'A standard for giving an app limited access without sharing your password.','Like giving a valet key instead of your master key.','An app can read approved Google data without seeing your password.',['Authentication vs. Authorization','API']],['Webhook','Webhook',0,'An automatic HTTP message sent when a specific event happens.','The courier texts you when the parcel arrives.','A payment provider calls your webhook after payment succeeds.',['API','REST','JSON']],['REST','Representational State Transfer',0,'A common style for designing web APIs around resources and HTTP actions.','A predictable counter: resource + action.','GET /orders reads; POST /orders creates.',['API','JSON']],['JSON','JavaScript Object Notation',2,'A lightweight text format for structured data.','A labelled form humans and software can read.','APIs commonly return fields and values as JSON.',['API','REST','SQL']],['Message Queue','Message Queue',4,'A buffer that lets systems send work for later independent processing.','A ticket tray where work waits safely.','Checkout queues an email instead of waiting for email delivery.',['Kafka','Microservices']],['DNS','Domain Name System',1,'The system that translates domain names into IP addresses.','Your contacts turning a name into a phone number.','DNS tells the browser which server hosts a domain.',['CDN','Load Balancer']],['Docker','Docker / Container',1,'A way to package an app with its dependencies so it runs consistently.','A standardized shipping container for software.','The same image runs in dev, test and production.',['Kubernetes','CI/CD']],['Git','Git / Version Control',5,'A version-control system that records file changes and supports collaboration.','A detailed history you can branch, compare and restore.','Teams commit, branch and merge reviewed code.',['CI/CD','Docker']],['SQL','Structured Query Language',2,'A language for reading, joining and changing relational data.','Asking a precise question of tables.','A BA can compare source and target records with SQL.',['Database Index','Data Lineage']],['Database Index','Database Index',2,'A structure that helps a database find rows without scanning the whole table.','A book index taking you to the right page.','An index on customer_id speeds repeated lookups.',['SQL','Cache']],['Cache','Cache',1,'A fast temporary store for frequently needed data.','Keeping common documents on your desk.','A service caches product data to avoid repeated database calls.',['CDN','Database Index']]];const ALIAS={'container (docker)':'Docker','git / version control':'Git','index (database)':'Database Index'};let data=[],current=0;function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}function parse(t){let m=t.match(/const ITEMS = \[([\s\S]*?)\n\];/);if(!m)throw Error('Library data not found');return Function('return ['+m[1]+']')()}function canon(base){let out=[],seen=new Set;[...base.map(x=>ALIAS[x.t.toLowerCase()]?{...x,t:ALIAS[x.t.toLowerCase()]}:x),...EXTRA.map(x=>({t:x[0],full:x[1],c:x[2],p:x[3],a:x[4],w:x[5],m:x[3],rel:x[6]}))].forEach(x=>{let k=norm(x.t);if(!seen.has(k)){seen.add(k);out.push(x)}});return out}const FLOW={OAuth:['You','Consent','Token','App'],Webhook:['Event','Webhook','App'],REST:['Client','HTTP action','Resource'],JSON:['Field','Value','Object'],'Message Queue':['Producer','Queue','Consumer'],DNS:['Domain','DNS','IP','Server'],CDN:['User','Nearby CDN','Origin'],Docker:['Code','Container','Host'],Kubernetes:['Containers','Kubernetes','Scale'],Git:['Working copy','Commit','History'],SQL:['Question','SQL','Rows'],Encryption:['Plain data','Encrypt','Ciphertext'],'Load Balancer':['Users','Load Balancer','Servers'],'Database Index':['Query','Index','Rows'],Cache:['Request','Cache','Source'],Microservices:['Client','Gateway','Services'],ETL:['Extract','Transform','Load'],'Data Lineage':['Source','Transform','Target'],'API Gateway':['Client','Gateway','Services'],'Unit Testing':['Function','Test','Pass / Fail'],'Integration Testing':['System A','Integration','System B'],'Regression Testing':['Existing feature','Change','Re-test'],UAT:['Business need','UAT','Accept'],'User Story':['User','Need','Value'],'Acceptance Criteria':['Story','Rules','Done'],Sprint:['Backlog','Sprint','Increment']};function bespoke(t){const n=norm(t);if(n==='api')return `<div class="api-map"><div class="api-side"><div class="api-device">📱<br>Your App</div></div><div class="api-center">API<small>the messenger</small></div><div class="api-side"><div class="api-system">🖥️<br>Service / System<br><small>＋ Data</small></div></div><div class="api-lines"><div><b>Request →</b><br>ask for data/action</div><div>contract</div><div><b>← Response</b><br>result comes back</div></div></div>`;if(n==='kafka')return `<div class="kafka-map"><div><div class="k-col"><div class="k-card">🛒 Orders</div><div class="k-card">📱 App events</div><div class="k-card">⚙️ Services</div></div><div class="k-arrow">→ Producers</div></div><div class="k-topic">Kafka Topic<div class="events"><span class="event">1</span><span class="event">2</span><span class="event">3</span><span class="event">4</span></div><div style="font-size:.72rem;margin-top:10px;color:var(--muted)">durable event stream</div></div><div><div class="k-arrow">Consumers →</div><div class="k-col"><div class="k-card">Analytics</div><div class="k-card">Database</div><div class="k-card">Monitoring</div></div></div></div>`;if(n==='cicd')return `<div class="pipeline"><div class="pstep"><strong>⌨</strong>Code</div><div class="parrow">→</div><div class="pstep"><strong>⚙</strong>Build</div><div class="parrow">→</div><div class="pstep"><strong>✓</strong>Test</div><div class="parrow">→</div><div class="pstep"><strong>🚀</strong>Deploy</div><div class="parrow">→</div><div class="pstep final"><strong>▣</strong>Production</div></div>`;if(n==='authenticationvsauthorization')return `<div class="auth-map"><div class="auth-box"><div class="auth-head">1. Authentication · Who are you?</div><div class="auth-step">👤 Enter credentials / identity proof</div><div class="auth-step">✓ System verifies identity</div><div class="auth-step">Result: you are signed in</div></div><div class="auth-mid">→</div><div class="auth-box authorize"><div class="auth-head">2. Authorization · What can you do?</div><div class="auth-step">🔑 System checks role / permissions</div><div class="auth-step">✓ Access rules are evaluated</div><div class="auth-step">Result: allowed actions/resources</div></div></div>`;if(n==='boundaryvalueanalysis')return `<div class="boundary"><div class="range-labels"><span class="bad">Below range · invalid</span><span class="good">Valid range</span><span class="bad">Above range · invalid</span></div><div class="numline"><span class="mark bad m17">17</span><span class="mark good m18">18</span><span class="mark good m19">19</span><span class="mark good m59">59</span><span class="mark good m60">60</span><span class="mark bad m61">61</span></div><div class="test-note">Test just below, at, and just above each boundary — bugs often hide there.</div></div>`;return ''}function visual(x){let b=bespoke(x.t);if(b)return b;let t=x.t;if(t==='Star Schema')return `<div class="star"><div class="node">Product</div><div class="node">Date</div><div class="node">Customer</div><div class="node core center">FACT<br>Sales</div><div class="node">Store</div></div>`;if(/Primary Key|Foreign Key/.test(t))return `<div class="tables"><div class="table"><div class="row"><b>Customer_ID 🔑</b></div><div class="row">Name</div></div><span class="arrow">→</span><div class="table"><div class="row">Order_ID 🔑</div><div class="row"><b>Customer_ID</b></div></div></div>`;if(t==='Monolith')return `<div class="stack"><div class="layer">UI</div><div class="layer core">One application</div><div class="layer">Business logic + Data access</div></div>`;if(t==='Three-Tier Architecture')return `<div class="stack"><div class="layer">Presentation</div><div class="layer core">Business Logic</div><div class="layer">Data</div></div>`;if(t==='Agile'||t==='Scrum')return `<div class="cycle"><span class="badge">Plan</span><span class="arrow">→</span><span class="badge">Build</span><span class="arrow">→</span><span class="badge">Review</span><span class="arrow">↻</span></div>`;let ns=FLOW[t]||(x.c===2?['Question',t,'Data']:x.c===3?['Scenario',t,'Result']:x.c===1?['Request',t,'Service']:x.c===4?['Input',t,'Components']:x.c===5?['Backlog',t,'Outcome']:['Need',t,'Outcome']);return `<div class="flow">${ns.map((v,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node ${i===1?'core':''}">${esc(v)}</div>`).join('')}</div>`}function qs(x){return x.c===2?['What is the source?','How fresh is it?','How is it validated?']:x.c===3?['What are we proving?','What is expected?','Which edge cases matter?']:x.c===1?['What depends on it?','How can it fail?','How is access controlled?']:x.c===4?['What owns this?','What depends on it?','Where is the boundary?']:x.c===5?['Who owns it?','What does done mean?','What happens next?']:['What goes in?','What comes out?','What can fail?']}function side(f=''){f=norm(f);let h='';CATS.forEach((g,c)=>{let a=data.filter(x=>x.c===c&&(!f||norm(x.t+' '+x.full).includes(f)));if(a.length)h+=`<div class="group-title">${g} · ${a.length}</div>`+a.map(x=>`<button class="term ${data.indexOf(x)===current?'active':''}" onclick="show(${data.indexOf(x)})"><strong>${esc(x.t)}</strong><small>${esc(x.full)}</small></button>`).join('')});document.getElementById('terms').innerHTML=h||'No matching concepts.'}function render(){let x=data[current];document.getElementById('view').innerHTML=`<article class="card"><section class="hero"><h1>${esc(x.t)}</h1><span class="pill">${esc(x.full)}</span><div class="plain">${esc(x.p)}</div><div class="analogy">💡 ${esc(x.a)}</div></section><div class="content"><section class="diagram"><div class="label">See the idea</div><div class="viz">${visual(x)}</div></section><div class="three"><section class="panel work"><div class="label">At work</div><div class="quote">${esc(x.w)}</div></section><section class="panel"><div class="label">BA Lens</div><ul class="qs">${qs(x).map(q=>`<li>${esc(q)}</li>`).join('')}</ul></section><section class="panel memory"><div class="label">Remember this</div><div class="small">★ ${esc(x.a)}</div></section></div><div class="bottom"><section class="panel"><div class="label">Related concepts</div>${(x.rel||[]).map(r=>`<button class="tag" data-rel="${encodeURIComponent(r)}">${esc(r)}</button>`).join('')}</section></div></div></article>`;document.getElementById('count').textContent=data.length+' concepts';history.replaceState(null,'','?term='+encodeURIComponent(x.t));side(document.getElementById('search').value);document.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>go(decodeURIComponent(b.dataset.rel)))}function show(i){current=i;render();scrollTo({top:0,behavior:'smooth'})}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){current=Math.floor(Math.random()*data.length);render()}function go(t){let n=norm(t),i=data.findIndex(x=>norm(x.t)===n);if(i>=0)show(i)}document.getElementById('search').oninput=e=>side(e.target.value);fetch(ARCHIVE).then(r=>{if(!r.ok)throw Error('Archive unavailable');return r.text()}).then(t=>{data=canon(parse(t));let q=new URLSearchParams(location.search).get('term');if(q){let n=norm(q),i=data.findIndex(x=>norm(x.t)===n);if(i>=0)current=i}render()}).catch(()=>document.getElementById('view').innerHTML='<div class="card" style="padding:40px">Library unavailable. Please refresh.</div>');</script></body></html>
