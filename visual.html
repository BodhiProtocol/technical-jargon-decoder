<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Jargon Decoder · BodhiProtocol</title><style>:root{--bg:#f6f8fb;--ink:#111827;--muted:#667085;--line:#e5e7eb;--green:#0f8f67;--soft:#f0faf6;--blue:#2f7dd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line)}.shell{max-width:1450px;margin:auto;padding:0 24px}.top .shell{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;text-decoration:none;color:inherit}.logo b{color:#6f55e8}.back{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 0}.side,.lesson{background:#fff;border:1px solid var(--line);border-radius:18px}.side{padding:12px;max-height:calc(100vh - 105px);overflow:auto}.side h3{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:3px 5px 10px}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.group{font-size:10px;font-weight:900;letter-spacing:.08em;color:#8b93a7;padding:16px 7px 5px}.term{width:100%;border:0;background:none;text-align:left;padding:7px;border-radius:9px;cursor:pointer}.term:hover,.term.active{background:var(--soft)}.term b{display:block;font-size:12px}.term small{font-size:9px;color:var(--muted)}.toolbar{height:34px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.buttons button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;margin-left:5px}.lesson{padding:20px 26px}.head{display:flex;align-items:center;gap:10px;padding-bottom:13px;border-bottom:1px solid var(--line)}.num{width:23px;height:23px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:11px;font-weight:900}.head h1{font-size:24px;margin:0}.full{font-size:10px;color:var(--green);font-weight:800}.body{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:18px 0 14px;align-items:start}.copy h4,.diagram h4{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 7px}.plain{font-size:13px;line-height:1.5}.diagram{border-left:1px solid var(--line);padding-left:28px}.viz{min-height:175px;display:flex;align-items:center;justify-content:center}.related{border-top:1px solid var(--line);padding-top:12px;font-size:10px;font-weight:800}.tag{display:inline-block;margin-left:8px;border:1px solid #cce8dd;background:#f7fcfa;color:var(--green);padding:4px 9px;border-radius:999px;font-size:9px}.api{display:grid;grid-template-columns:130px 90px 190px;gap:25px;align-items:center}.device,.system{border:1px solid var(--line);border-radius:12px;padding:15px;text-align:center;font-weight:800;font-size:11px}.cloud{height:86px;border:1px solid #a9d2f6;background:#eff8ff;border-radius:45%;display:grid;place-items:center;text-align:center;color:var(--blue);font-size:18px;font-weight:900}.cloud small{font-size:8px;color:var(--muted)}.api-lines{grid-column:1/-1;display:grid;grid-template-columns:130px 90px 190px;gap:25px;text-align:center;font-size:9px}.req{color:var(--blue);font-weight:800}.res{color:#e58b32;font-weight:800}.kafka{display:grid;grid-template-columns:115px 32px 220px 32px 120px;align-items:center;gap:7px}.col{display:grid;gap:6px}.box{border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;font-size:9px;font-weight:800}.topic{background:var(--soft);border:1px solid #bfe5d7;border-radius:14px;padding:17px;text-align:center;color:var(--green);font-weight:900}.events{margin-top:8px;display:flex;justify-content:center;gap:5px}.events span{border:1px solid #bfe5d7;background:white;border-radius:4px;padding:3px 6px}.arrow{text-align:center;font-size:20px;color:var(--green)}.label{text-align:center;font-size:9px;font-weight:800;margin-bottom:5px}.pipeline{display:flex;align-items:center;gap:9px}.step{width:78px;height:70px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:800}.step strong{font-size:18px}.generic{display:flex;align-items:center;gap:12px}.generic .box{padding:15px;min-width:110px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{max-height:250px}.body{grid-template-columns:1fr}.diagram{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.api,.kafka{transform:scale(.85)}}@media(max-width:600px){.shell{padding:0 12px}.lesson{padding:16px}.kafka{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.api{grid-template-columns:1fr}.api-lines{display:none}}</style></head><body><div class="top"><div class="shell"><a class="logo" href="https://bodhiprotocol.com/">Bodhi<b>Protocol</b></a><div class="back">← Jargon Decoder home</div></div></div><div class="shell"><div class="layout"><aside class="side"><h3>EXPLORE CONCEPTS</h3><input id="search" class="search" placeholder="Search all concepts..."><div id="terms"></div></aside><main><div class="toolbar"><span>Visual learning · <b id="count">…</b></span><div class="buttons"><button onclick="randomTerm()">↝ Random</button><button onclick="prev()">←</button><button onclick="next()">Next →</button></div></div><div id="view"></div></main></div></div><script>const ARCHIVE='https://raw.githubusercontent.com/BodhiProtocol/technical-jargon-decoder/8853a32fe2c8bba4ad92dbfd1889e592ec8b885f/index.html';const CATS=['Software & Development','Cloud & Infrastructure','Data & Databases','Testing & QA','Architecture','Agile & Delivery'];const EXTRA=[['Kafka','Event Streaming Platform',2,'Kafka is a system that lets many producers publish events which many consumers can read independently in real-time.',['Message Queue','Producer','Consumer','Topic','Stream']]];let data=[],current=0;const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function parse(t){let m=t.match(/const ITEMS = \[([\s\S]*?)\n\];/);return Function('return ['+m[1]+']')()}function canon(base){let a=[...base,...EXTRA.map(x=>({t:x[0],full:x[1],c:x[2],p:x[3],rel:x[4]}))],out=[],seen=new Set;for(let x of a){let k=norm(x.t);if(!seen.has(k)){seen.add(k);out.push(x)}}return out}function visual(x){let n=norm(x.t);if(n==='api')return `<div class="api"><div class="device">📱<br>Your App</div><div class="cloud">API<small>The Messenger</small></div><div class="system">🖥️ Service / System<br>🗄️ Data</div><div class="api-lines"><div><span class="req">Request →</span><br>Ask for data</div><div></div><div><span class="res">← Response</span><br>Get data</div></div></div>`;if(n==='kafka')return `<div class="kafka"><div><div class="label">Producers</div><div class="col"><div class="box">🛒 Orders</div><div class="box">📱 App</div><div class="box">⚙ Services</div></div></div><div class="arrow">→</div><div class="topic">Kafka Topic<div style="font-size:9px;color:#667085">Event Stream</div><div class="events"><span>✉</span><span>✉</span><span>✉</span><span>✉</span></div></div><div class="arrow">→</div><div><div class="label">Consumers</div><div class="col"><div class="box">Analytics</div><div class="box">Database</div><div class="box">Monitoring</div></div></div></div>`;if(n==='cicd')return `<div class="pipeline"><div class="step"><strong>⌨</strong>Code</div>→<div class="step"><strong>⚙</strong>Build</div>→<div class="step"><strong>✓</strong>Test</div>→<div class="step"><strong>🚀</strong>Deploy</div>→<div class="step"><strong>▣</strong>Production</div></div>`;return `<div class="generic"><div class="box">Input</div><div class="arrow">→</div><div class="box" style="background:var(--soft);color:var(--green)">${esc(x.t)}</div><div class="arrow">→</div><div class="box">Outcome</div></div>`}function side(f=''){f=norm(f);let h='';CATS.forEach((g,c)=>{let a=data.filter(x=>x.c===c&&(!f||norm(x.t+' '+x.full).includes(f)));if(a.length)h+=`<div class="group">${g} · ${a.length}</div>`+a.map(x=>`<button class="term ${data.indexOf(x)===current?'active':''}" onclick="show(${data.indexOf(x)})"><b>${esc(x.t)}</b><small>${esc(x.full)}</small></button>`).join('')});terms.innerHTML=h}function render(){let x=data[current];let rel=x.rel||[];view.innerHTML=`<article class="lesson"><div class="head"><span class="num">${current+1}</span><h1>${esc(x.t)}</h1><span class="full">${esc(x.full)}</span></div><div class="body"><div class="copy"><h4>Plain English</h4><div class="plain">${esc(x.p)}</div></div><div class="diagram"><h4>See the Concept</h4><div class="viz">${visual(x)}</div></div></div><div class="related">Related Concepts:${rel.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div></article>`;count.textContent=data.length+' concepts';history.replaceState(null,'','?term='+encodeURIComponent(x.t));side(search.value)}function show(i){current=i;render()}function next(){current=(current+1)%data.length;render()}function prev(){current=(current-1+data.length)%data.length;render()}function randomTerm(){current=Math.floor(Math.random()*data.length);render()}search.oninput=e=>side(e.target.value);fetch(ARCHIVE).then(r=>r.text()).then(t=>{data=canon(parse(t));let q=new URLSearchParams(location.search).get('term');if(q){let i=data.findIndex(x=>norm(x.t)===norm(q));if(i>=0)current=i}render()});</script></body></html>
